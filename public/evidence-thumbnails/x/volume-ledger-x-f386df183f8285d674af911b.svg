  <text x="92" y="113" class="date">Tue Nov 28 17:16:04 +0000 2023</text>
  <text class="body"><tspan x="92" y="178">Going on my 3rd kite surf adventure this year! Grateful for the day I</tspan><tspan x="92" y="216">turned my 'respect' (okay, fear 😅) of the ocean into a passion. Kite</tspan><tspan x="92" y="254">surfing has been more than just relaxation for the mind; it has taken</tspan><tspan x="92" y="292">me to breathtaking spots across the globe I never would've seen</tspan><tspan x="92" y="330">otherwise. Sometimes, choosing the hard path can lead you to some</tspan><tspan x="92" y="368">unexpected extraordinary destinations #LifeBeyondComfortZones</tspan></text>
