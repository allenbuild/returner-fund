  <text x="92" y="113" class="date">Thu Aug 13 16:11:20 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Claude Hack that actually saves a lot of time: Agents often output</tspan><tspan x="92" y="216">blocks of text that can be a waste of time to read. If you tell it to</tspan><tspan x="92" y="254">answer in under a certain number of words, it doesn't do a great job</tspan><tspan x="92" y="292">with its presentation of information. However, my co-founder</tspan><tspan x="92" y="330">@m_y_serrano found that if you tell it to use tokens as constraints,</tspan><tspan x="92" y="368">the short summaries become a lot more coherent (i.e. summarize in</tspan><tspan x="92" y="406">under 100 tokens).</tspan></text>
