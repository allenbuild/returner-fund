  <text class="body"><tspan x="92" y="178">Anthropic just published a chart that should keep everyone up at</tspan><tspan x="92" y="216">night. Not out of fear. Out of excitement. The chart shows two things.</tspan><tspan x="92" y="254">What AI could theoretically do across every occupation (blue area,</tspan><tspan x="92" y="292">massive) versus what AI actually does today (red area, tiny). Computer</tspan><tspan x="92" y="330">and math jobs have 94% theoretical AI exposure. But only 33% actual AI</tspan><tspan x="92" y="368">coverage right now. We are using a third of what is already possible.</tspan><tspan x="92" y="406">Let that sink in. The AI tools that exist today. Right now, not in...</tspan></text>
