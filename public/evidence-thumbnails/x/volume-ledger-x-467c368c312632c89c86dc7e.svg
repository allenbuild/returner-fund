  <text x="146" y="94" class="author">Govind Kavaturi</text>
  <text x="146" y="128" class="handle">@Govikavaturi</text>
  <text x="92" y="113" class="date">Tue Apr 07 03:22:35 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Web apps, desktop apps, mobile apps are all over. Agentic apps are the</tspan><tspan x="92" y="216">future. Right now they live in terminals, the way every new thing does</tspan><tspan x="92" y="254">before it finds its form. The shape they'll take is a communication</tspan><tspan x="92" y="292">layer - almost no interface, one or many agents doing whatever you ask</tspan><tspan x="92" y="330">from coding to science to chores.</tspan></text>
