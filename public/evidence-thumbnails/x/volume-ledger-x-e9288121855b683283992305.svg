  <text class="body"><tspan x="92" y="178">Okay wait this got far more attention than I thought it would so I’ll</tspan><tspan x="92" y="216">just share how it works here: In essence, every closed loop servo</tspan><tspan x="92" y="254">motor knows its position and reports how hard it's working (how much</tspan><tspan x="92" y="292">electric current it's pulling to hold its position). The trick is to</tspan><tspan x="92" y="330">combine that information with a soft gripper finger. By calibrating</tspan><tspan x="92" y="368">the current used over the gripper's deformation curve, you are able to</tspan><tspan x="92" y="406">obtain a progressive force response. I’m refining the code right no...</tspan></text>
