  <text class="body"><tspan x="92" y="178">Dec 9th (Middle): The ankle (hock) is unrecognisable. The leg is a</tspan><tspan x="92" y="216">swollen, uniform cylinder + fluid retention completely obscures the</tspan><tspan x="92" y="254">underlying bone and muscle structure (circled in red). The tumours are</tspan><tspan x="92" y="292">red, tense, and projecting outward Jan 20 (Right): The &quot;heavy&quot; fluid</tspan><tspan x="92" y="330">weight is gone. You can now clearly see the Achilles tendon and the</tspan><tspan x="92" y="368">sharp definition of the ankle bone. The tumours have flattened against</tspan><tspan x="92" y="406">the skin and turned grey (pointed out by the arrows)</tspan></text>
