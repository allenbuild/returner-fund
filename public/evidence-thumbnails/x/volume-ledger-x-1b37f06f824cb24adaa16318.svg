  <text x="92" y="113" class="date">Wed May 27 05:07:38 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">When building an agent, it always bothered me that I could not</tspan><tspan x="92" y="216">evaluate exactly what actions it could take before dropping it into</tspan><tspan x="92" y="254">production. At Scale AI, we've always pushed the notion that evals are</tspan><tspan x="92" y="292">intuitively the best way to see how an LLM performs. When coupled with</tspan><tspan x="92" y="330">a harness, my co-founder @theophorus7 and I had a tough time finding a</tspan><tspan x="92" y="368">tool or realistic production tier sandboxes to evaluate our agents in</tspan><tspan x="92" y="406">pre-prod Super proud to announce Archal (YC S26) as the agent eval...</tspan></text>
