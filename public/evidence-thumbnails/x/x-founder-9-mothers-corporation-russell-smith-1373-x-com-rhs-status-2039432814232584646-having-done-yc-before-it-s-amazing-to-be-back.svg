  <text class="body"><tspan x="92" y="178">Having done YC before, it's amazing to be back. The energy is the same</tspan><tspan x="92" y="216">14 years (!!) on. Also, the quality of the folks I met was just as a</tspan><tspan x="92" y="254">high, if not more. So many have done a ton already, some are early.</tspan><tspan x="92" y="292">All are moving super fast. Crazy achievement by the YC team and</tspan><tspan x="92" y="330">@garrytan. My personal takeaways from the kick off of P26: - the</tspan><tspan x="92" y="368">vibe/how folks/users feel matters - prolly even more for hardware -</tspan><tspan x="92" y="406">what is the smallest thing one can actually ship rn - watch out for...</tspan></text>
