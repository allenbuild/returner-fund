  <text class="body"><tspan x="92" y="178">If you're a broker or carrier selling direct-to-consumer, @ycombinator</tspan><tspan x="92" y="216">and Tarantino have a message for you. Your buyers are now using AI to</tspan><tspan x="92" y="254">research and decide which insurance to buy. You need to adapt your</tspan><tspan x="92" y="292">distribution for the world where buyers rely on AI agents to make</tspan><tspan x="92" y="330">decisions. The good news? - Both consumers and insurance businesses</tspan><tspan x="92" y="368">will benefit from this efficiency. - @kinroai (YC P26) helps your</tspan><tspan x="92" y="406">company win in this agentic world using the expertise of InsurTech...</tspan></text>
