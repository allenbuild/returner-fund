  <text class="body"><tspan x="92" y="178">i met cursor's CEO in 2023 at buildspace he was interviewing everyone</tspan><tspan x="92" y="216">- and he did it with a paper notepad, scribbling notes like a maniac</tspan><tspan x="92" y="254">while people used his product he asked open ended questions and</tspan><tspan x="92" y="292">listened deeply to every single details, couldn't be distracted by</tspan><tspan x="92" y="330">anythin a few weeks later he emailed me for a founding-engineer role i</tspan><tspan x="92" y="368">ignored him and now cursor has being acquired for ~$60B 🙃 but the</tspan><tspan x="92" y="406">important thing to remember is how he was talking to his users</tspan></text>
