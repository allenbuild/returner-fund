  <text class="body"><tspan x="92" y="178">This is a new paradigm for interacting with Claude that is</tspan><tspan x="92" y="216">significantly more &quot;inline&quot; with all the other human activity</tspan><tspan x="92" y="254">org-wide. Once you do all of the under the hood engineering work to</tspan><tspan x="92" y="292">make this &quot;just work&quot; (e.g. across tools, integrations, compute</tspan><tspan x="92" y="330">environments, memory, security, etc.), Claude basically joins the team</tspan><tspan x="92" y="368">in a seamless way - you can talk to it as you would talk to a person</tspan><tspan x="92" y="406">and it can help with a very large variety of workloads. Imo this is...</tspan></text>
