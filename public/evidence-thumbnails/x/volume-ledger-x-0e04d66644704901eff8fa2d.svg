  <text x="146" y="94" class="author">Aaron Epstein</text>
  <text x="146" y="128" class="handle">@aaron_epstein</text>
  <text x="92" y="113" class="date">Mon Jul 13 16:03:49 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Think of startup sales as a doctor/patient relationship. If you just</tspan><tspan x="92" y="216">walked into the doctor's office and they said &quot;here take this</tspan><tspan x="92" y="254">prescription&quot;, you wouldn't trust it at all. They don't even know what</tspan><tspan x="92" y="292">problems you have yet! Sales is the same. You are the doctor/expert</tspan><tspan x="92" y="330">that has to ask lots of questions to understand your customer's</tspan><tspan x="92" y="368">problems before you earn the right to show how your product can help.</tspan><tspan x="92" y="406">(shoutout @ryanRneu for teaching this to many founders)</tspan></text>
  <text x="92" y="476" class="metrics">42.9K views / 559 likes / 46 reposts / 8 quotes</text>
