  <text x="92" y="113" class="date">Thu Nov 27 10:10:21 +0000 2025</text>
  <text class="body"><tspan x="92" y="178">In my experience, if u describe anything in low enough detail to a</tspan><tspan x="92" y="216">model, it will work. A proof for this is: if you provide it the exact</tspan><tspan x="92" y="254">solution in code, all frontier models can echo it back to you If I</tspan><tspan x="92" y="292">already know the exact solution (almost always the case in product</tspan><tspan x="92" y="330">level code), it’s much faster to use “low-level-english” instructions</tspan><tspan x="92" y="368">vs program it myself</tspan></text>
