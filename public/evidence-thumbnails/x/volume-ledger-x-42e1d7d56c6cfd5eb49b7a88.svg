  <text class="body"><tspan x="92" y="178">K3 is not uniformly better than GPT-5.6 or Anthropic’s strongest</tspan><tspan x="92" y="216">models. But it is now competitive on several of the tasks that matter</tspan><tspan x="92" y="254">most for agents: repository-scale coding, browsing, automation, tool</tspan><tspan x="92" y="292">use, and sustained execution. That is a much bigger result than</tspan><tspan x="92" y="330">winning one benchmark.</tspan></text>
