  <text class="body"><tspan x="92" y="178">I played with Gemini 3 yesterday via early access. Few thoughts -</tspan><tspan x="92" y="216">First I usually urge caution with public benchmarks because imo they</tspan><tspan x="92" y="254">can be quite possible to game. It comes down to discipline and</tspan><tspan x="92" y="292">self-restraint of the team (who is meanwhile strongly incentivized</tspan><tspan x="92" y="330">otherwise) to not overfit test sets via elaborate gymnastics over</tspan><tspan x="92" y="368">test-set adjacent data in the document embedding space. Realistically,</tspan><tspan x="92" y="406">because everyone else is doing it, the pressure to do so is high. G...</tspan></text>
