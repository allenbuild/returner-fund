  <text x="92" y="113" class="date">Sat Apr 25 00:37:34 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">My core values come straight from my grandparents. I was close with</tspan><tspan x="92" y="216">all four of them. One taught me to see the positive in every</tspan><tspan x="92" y="254">circumstance. To keep smiling. One taught me that if you don't dare,</tspan><tspan x="92" y="292">you don't get. One taught me that work is sacred, and that details are</tspan><tspan x="92" y="330">everything. One taught me to keep the door open and always make time</tspan><tspan x="92" y="368">for people. Generosity is the greatest form of humanity. Everything</tspan><tspan x="92" y="406">I'm building is on the back of their legacies. In time, I'll share...</tspan></text>
