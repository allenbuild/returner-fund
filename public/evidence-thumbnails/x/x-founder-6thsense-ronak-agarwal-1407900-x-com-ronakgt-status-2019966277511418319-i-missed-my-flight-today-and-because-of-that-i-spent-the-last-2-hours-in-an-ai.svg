  <text class="body"><tspan x="92" y="178">i missed my flight today. and because of that, i spent the last 2</tspan><tspan x="92" y="216">hours in an airport lounge drinking cocktails, eating gas tomato soup,</tspan><tspan x="92" y="254">and crying with a stranger whose story i’ll probably never forget. he</tspan><tspan x="92" y="292">was ex-military. first time ever flying. heading home for his</tspan><tspan x="92" y="330">grandfather’s bereavement - the man who raised him like a dad. in 2012</tspan><tspan x="92" y="368">his grandma died while he was driving past their house. coroner said</tspan><tspan x="92" y="406">4:30pm. he passed by at 4. he still believes that if he had stopped...</tspan></text>
