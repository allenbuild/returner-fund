  <text x="146" y="94" class="author">Emil Falk</text>
  <text x="146" y="128" class="handle">@falkemil_</text>
  <text x="92" y="113" class="date">Wed Jul 22 18:21:32 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">@ycombinator should fund more companies working on the hardware test</tspan><tspan x="92" y="216">equipment side. The bottleneck in hardware development has shifted</tspan><tspan x="92" y="254">from code generation to code testing. At Tenet we have to build our</tspan><tspan x="92" y="292">own test equipment for our hardware in order to keep up with the</tspan><tspan x="92" y="330">increase of better models if we want to go from 100x efficiency to</tspan><tspan x="92" y="368">1000x</tspan></text>
  <text x="92" y="476" class="metrics">17 views / 2 likes</text>
