  <text x="92" y="113" class="date">Tue Mar 24 16:56:24 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Software horror: litellm PyPI supply chain attack. Simple `pip install</tspan><tspan x="92" y="216">litellm` was enough to exfiltrate SSH keys, AWS/GCP/Azure creds,</tspan><tspan x="92" y="254">Kubernetes configs, git credentials, env vars (all your API keys),</tspan><tspan x="92" y="292">shell history, crypto wallets, SSL private keys, CI/CD secrets,</tspan><tspan x="92" y="330">database passwords. LiteLLM itself has 97 million downloads per month</tspan><tspan x="92" y="368">which is already terrible, but much worse, the contagion spreads to</tspan><tspan x="92" y="406">any project that depends on litellm. For example, if you did `pip...</tspan></text>
