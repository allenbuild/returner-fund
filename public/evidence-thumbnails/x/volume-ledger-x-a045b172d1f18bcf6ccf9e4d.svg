  <text class="body"><tspan x="92" y="178">Sieve of Eratosthenes in 無語: 有數極限。 曰：「君欲求何數？ 」。 求：極限。 有問列質否，廣極限益一者，為是。</tspan><tspan x="92" y="216">順數現為二漸增至極限也 若質否其現者如是，則 曰：現：「 」。 順數倍為二漸增至極限拆現也 質否其現乘倍者為非。</tspan></text>
