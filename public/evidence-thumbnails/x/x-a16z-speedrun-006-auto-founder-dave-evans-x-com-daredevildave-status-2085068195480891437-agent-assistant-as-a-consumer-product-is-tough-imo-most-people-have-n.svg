  <text x="146" y="94" class="author">David Evans</text>
  <text x="146" y="128" class="handle">@daredevildave</text>
  <text x="92" y="113" class="date">Wed Aug 05 18:19:31 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Agent assistant as a consumer product is tough IMO - most people have</tspan><tspan x="92" y="216">never had an EA. And the ones who do know that it only beats doing it</tspan><tspan x="92" y="254">yourself after you've learned how to delegate effectively. That's a</tspan><tspan x="92" y="292">lot of work for a consumer, especially when the AI is flaky. We should</tspan><tspan x="92" y="330">be looking at the inverse - not you adapting to the agent, but the</tspan><tspan x="92" y="368">software adapting to you. Personalized feature sets, intelligent chat</tspan><tspan x="92" y="406">as an interface, voice &amp; image input composed with UIs that we have...</tspan></text>
  <text x="92" y="476" class="metrics">112 views</text>
