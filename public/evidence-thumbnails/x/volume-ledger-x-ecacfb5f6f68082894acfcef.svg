  <text class="body"><tspan x="92" y="178">People say that starting a company requires a lot: team, network,</tspan><tspan x="92" y="216">resilience, optimism, strength, insights bla bla bla. But at the heart</tspan><tspan x="92" y="254">of it all, its really just care and curiosity. I deeply care about a</tspan><tspan x="92" y="292">problem, which fuels my insatiable curiosity. This combination drives</tspan><tspan x="92" y="330">me, makes me happy, and keeps me going at it again and again and again</tspan><tspan x="92" y="368">🤷‍♀️</tspan></text>
