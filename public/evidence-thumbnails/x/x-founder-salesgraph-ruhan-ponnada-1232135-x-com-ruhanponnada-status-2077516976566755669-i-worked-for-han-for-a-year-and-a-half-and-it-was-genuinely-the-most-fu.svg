  <text class="body"><tspan x="92" y="178">I worked for Han for a year and a half, and it was genuinely the most</tspan><tspan x="92" y="216">fun I’ve ever had at work and probably the only time I’ve ever felt</tspan><tspan x="92" y="254">work as fun. People took “remember to not smile” too literally. Look</tspan><tspan x="92" y="292">at the photos Hahnbee and Han post. We were always smiling. What boss</tspan><tspan x="92" y="330">man was trying to say was: stay locked tf in. Winning early stage</tspan><tspan x="92" y="368">often requires doing the most: staying late to win over a champion,</tspan><tspan x="92" y="406">finishing the feature a customer needs, or all hands on deck for a...</tspan></text>
