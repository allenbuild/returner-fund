  <text x="146" y="94" class="author">Andrej Karpathy</text>
  <text x="146" y="128" class="handle">@karpathy</text>
  <text x="92" y="113" class="date">Mon Oct 20 22:13:40 +0000 2025</text>
  <text class="body"><tspan x="92" y="178">I quite like the new DeepSeek-OCR paper. It's a good OCR model (maybe</tspan><tspan x="92" y="216">a bit worse than dots), and yes data collection etc., but anyway it</tspan><tspan x="92" y="254">doesn't matter. The more interesting part for me (esp as a computer</tspan><tspan x="92" y="292">vision at heart who is temporarily masquerading as a natural language</tspan><tspan x="92" y="330">person) is whether pixels are better inputs to LLMs than text. Whether</tspan><tspan x="92" y="368">text tokens are wasteful and just terrible, at the input. Maybe it</tspan><tspan x="92" y="406">makes more sense that all inputs to LLMs should only ever be images...</tspan></text>
  <text x="92" y="476" class="metrics">3.3M views / 13.2K likes / 1.5K reposts / 392 quotes</text>
