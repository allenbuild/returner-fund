  <text class="body"><tspan x="92" y="178">You may pay a lot of taxes if you sell your shares. Some will just</tspan><tspan x="92" y="216">live off margin loans. You might wonder where that 13.3% state tax is</tspan><tspan x="92" y="254">going as you drive across potholes or step over needles on your way to</tspan><tspan x="92" y="292">work. Stop wondering. Start acting. Sign up for @garrytan 's</tspan><tspan x="92" y="330">https://garryslist.org . Educate yourself on how SF operates. Why it</tspan><tspan x="92" y="368">is the way it is. You have a voice and you can express yourself. You</tspan><tspan x="92" y="406">can also use your new found cash to donate to causes you care about...</tspan></text>
