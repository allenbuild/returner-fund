  <text class="body"><tspan x="92" y="178">This is wild. OpenAI's new model with cyber capabilities gate-kept to</tspan><tspan x="92" y="216">a select few HACKS Huggingface during benchmarking. But Huggingface</tspan><tspan x="92" y="254">couldn't defend against the attack with an OpenAI model because they</tspan><tspan x="92" y="292">weren't in the select few! They kept getting &quot;safety&quot; refusals. So,</tspan><tspan x="92" y="330">they had to defend with GLM-5.2, an open-weights model. It's</tspan><tspan x="92" y="368">remarkable to me that the heads of the big labs keep claiming that</tspan><tspan x="92" y="406">gate-keeping cyber will make the world safer when both...</tspan></text>
