  <text x="146" y="94" class="author">Anton Livaja</text>
  <text x="146" y="128" class="handle">@antonlivaja</text>
  <text x="92" y="113" class="date">Sun May 17 19:20:14 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">It's been a pretty intense 7 months of building but we are finally</tspan><tspan x="92" y="216">on-boarding clients to @CautionHosting. One of the crazy things I've</tspan><tspan x="92" y="254">realized is even though building a cloud hosting platform, for</tspan><tspan x="92" y="292">confidential compute at that, is complicated, billing somehow came out</tspan><tspan x="92" y="330">being the most annoying part. On the other hand the most fun part was</tspan><tspan x="92" y="368">building the feature that allows bringing your own existing AWS</tspan><tspan x="92" y="406">account, where Caution just manages the application deployment...</tspan></text>
