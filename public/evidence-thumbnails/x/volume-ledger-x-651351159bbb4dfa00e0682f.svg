  <text x="146" y="94" class="author">AndresFernando</text>
  <text x="146" y="128" class="handle">@AndresFGG_</text>
  <text x="92" y="113" class="date">Fri May 08 18:21:02 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Anthropic has developed Natural Language Autoencoders (NLAs), a new</tspan><tspan x="92" y="216">technique that converts a language model’s internal activations the</tspan><tspan x="92" y="254">usually unreadable numerical representations inside the AI into clear,</tspan><tspan x="92" y="292">human-readable text. What interests me most are the practical use</tspan><tspan x="92" y="330">cases: it lets us see what the model is actually thinking, even when</tspan><tspan x="92" y="368">it doesn’t express those thoughts in its output.</tspan><tspan x="92" y="406">https://www.anthropic.com/research/natural-language-autoencoders</tspan></text>
