  <text x="146" y="94" class="author">Nicolas Dessaigne</text>
  <text x="146" y="128" class="handle">@dessaigne</text>
  <text x="92" y="113" class="date">Thu Jun 18 16:39:27 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">I met a team this week selling &quot;cut your AI spend.&quot; I encouraged them</tspan><tspan x="92" y="216">to flip it. Buyers don't get promoted for spending less, they get</tspan><tspan x="92" y="254">promoted for shipping more. Frame the same product as &quot;do 3x more with</tspan><tspan x="92" y="292">what you already pay,&quot; and you go from a line-item nobody defends to a</tspan><tspan x="92" y="330">budget nobody questions. Selling savings caps your ceiling at the</tspan><tspan x="92" y="368">customer's current spend. Selling output has no ceiling.</tspan></text>
  <text x="92" y="476" class="metrics">47K views / 486 likes / 18 reposts / 7 quotes</text>
