  <text class="body"><tspan x="92" y="178">Incidentally, I’m very bullish on cybersecurity as one of the best</tspan><tspan x="92" y="216">benchmarks for superintelligence. The “IQ test” of software</tspan><tspan x="92" y="254">engineering. The best engineers I’ve worked with in my career have</tspan><tspan x="92" y="292">usually had a deep background or interest in security. It’s actually</tspan><tspan x="92" y="330">easy for a model to “one-shot an XYZ clone” and impress people on X.</tspan><tspan x="92" y="368">But that’s not a good test. Finding, patching, reversing, and</tspan><tspan x="92" y="406">exploiting require a cognitive skill that transcends programming...</tspan></text>
