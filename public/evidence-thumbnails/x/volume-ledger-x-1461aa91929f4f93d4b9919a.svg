  <text class="body"><tspan x="92" y="178">Churn prediction is a crowded market. Churn recovery is still wide</tspan><tspan x="92" y="216">open. 76% of B2B SaaS now runs AI churn prediction. The models work.</tspan><tspan x="92" y="254">90% accuracy and climbing. So anyone can see who is about to leave.</tspan><tspan x="92" y="292">But a prediction is a dashboard. It names the risk and stops there.</tspan><tspan x="92" y="330">The real leverage sits in the one second a customer tries to cancel.</tspan><tspan x="92" y="368">That is the highest intent they will ever show you. They have decided.</tspan><tspan x="92" y="406">Their finger is on the button. Predict all you want. If nothing act...</tspan></text>
