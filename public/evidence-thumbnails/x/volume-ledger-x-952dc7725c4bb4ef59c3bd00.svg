  <text class="body"><tspan x="92" y="178">Bought a new Mac mini to properly tinker with claws over the weekend.</tspan><tspan x="92" y="216">The apple store person told me they are selling like hotcakes and</tspan><tspan x="92" y="254">everyone is confused :) I'm definitely a bit sus'd to run OpenClaw</tspan><tspan x="92" y="292">specifically - giving my private data/keys to 400K lines of vibe coded</tspan><tspan x="92" y="330">monster that is being actively attacked at scale is not very appealing</tspan><tspan x="92" y="368">at all. Already seeing reports of exposed instances, RCE</tspan><tspan x="92" y="406">vulnerabilities, supply chain poisoning, malicious or compromised...</tspan></text>
