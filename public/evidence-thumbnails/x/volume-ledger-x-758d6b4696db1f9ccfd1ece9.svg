  <text class="body"><tspan x="92" y="178">something that would be nice to have in some projects is backend</tspan><tspan x="92" y="216">defined query invalidations vs frontend // client.ts</tspan><tspan x="92" y="254">&lt;some-mutation&gt;.mutate({invalidates: [x,y,z]}) feels a lot more likely</tspan><tspan x="92" y="292">to get out of sync then: // server.ts db.update(x, ...) db.insert(y,</tspan><tspan x="92" y="330">...) db.update(z, ...) return new response({ revalidatedData: [x's</tspan><tspan x="92" y="368">data, y's data, z's data] }) in the mean time, i'll probably keep</tspan><tspan x="92" y="406">invalidating all my data on every mutation...</tspan></text>
