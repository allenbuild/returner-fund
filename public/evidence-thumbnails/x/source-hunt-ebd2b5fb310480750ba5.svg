  <text class="body"><tspan x="92" y="178">A few weeks ago, we tested a $1,000 creator campaign on X. The results</tspan><tspan x="92" y="216">were promising. So this week, we decided to scale it. We spent $10,000</tspan><tspan x="92" y="254">on creators to see if the channel could become predictable. Here's</tspan><tspan x="92" y="292">exactly what we did. Step 1: We partnered with an agency that had been</tspan><tspan x="92" y="330">recommended to us. Step 2: We shortlisted 28 creators who had</tspan><tspan x="92" y="368">previously promoted launches for top AI companies. Step 3: Instead of</tspan><tspan x="92" y="406">reusing an old video, we produced a brand-new one specifically for...</tspan></text>
