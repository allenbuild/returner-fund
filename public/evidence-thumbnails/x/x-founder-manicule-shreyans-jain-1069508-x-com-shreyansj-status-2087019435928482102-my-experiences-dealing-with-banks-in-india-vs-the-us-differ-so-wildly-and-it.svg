  <text class="body"><tspan x="92" y="178">My experiences dealing with banks in India vs the US differ so wildly</tspan><tspan x="92" y="216">and it tells you a lot about where the countries are going If you walk</tspan><tspan x="92" y="254">into a US bank or credit union, all you need is a decent credit score</tspan><tspan x="92" y="292">and a short credit history to get a loan worth many times your annual</tspan><tspan x="92" y="330">income In India you need great credit score, long credit history,</tspan><tspan x="92" y="368">income tax return, income tax computation, bank statements, CA</tspan><tspan x="92" y="406">approved net worth statement, business balance sheets, business tax...</tspan></text>
