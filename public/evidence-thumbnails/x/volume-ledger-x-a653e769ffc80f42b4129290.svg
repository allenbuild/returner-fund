  <text class="body"><tspan x="92" y="178">I implemented something similar for YouTube Shorts. fully autonomous</tspan><tspan x="92" y="216">pipeline that: - generates topic, script, AI images, TTS, and renders</tspan><tspan x="92" y="254">video - uploads to YouTube via headless browser - scrapes its own view</tspan><tspan x="92" y="292">counts - feeds top/bottom performers to optimize next videos runs</tspan><tspan x="92" y="330">3x/day on a free AWS instance. zero manual steps. the metrics get</tspan><tspan x="92" y="368">better over time as it learns what the algorithm pushes in real time.</tspan><tspan x="92" y="406">http://github.com/CodeSarthak/autopilot-shorts</tspan></text>
