  <text class="body"><tspan x="92" y="178">Random thought: What’s the average cost of human intelligence vs.</tspan><tspan x="92" y="216">artificial intelligence? Getting AI from 0 → 1 took billions of</tspan><tspan x="92" y="254">dollars. But 1 → N might become so cheap that it makes me question the</tspan><tspan x="92" y="292">very economics of investing in human intelligence over artificial</tspan><tspan x="92" y="330">intelligence. If AI can discover, invent, and iterate using the same</tspan><tspan x="92" y="368">scientific methods and theories we do but at a pace we can’t match and</tspan><tspan x="92" y="406">at a fraction of the cost what does that mean for the future? (The...</tspan></text>
