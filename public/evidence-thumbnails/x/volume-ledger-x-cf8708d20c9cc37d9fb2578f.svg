  <text x="92" y="113" class="date">Tue Nov 25 17:00:02 +0000 2025</text>
  <text class="body"><tspan x="92" y="178">The unfair advantage of being an immigrant founder that people don’t</tspan><tspan x="92" y="216">talk about enough: you have an entire community back home rooting for</tspan><tspan x="92" y="254">you. When I first started @mirrormirror_ai , I was told not to “make</tspan><tspan x="92" y="292">the company look too Asian” if I wanted to succeed in the US. I took</tspan><tspan x="92" y="330">that advice to heart and intentionally turned down help, partnerships,</tspan><tspan x="92" y="368">and media opportunities from Asia. But the moment I stopped worrying</tspan><tspan x="92" y="406">about that, I realized how much I had been holding myself back. The...</tspan></text>
