  <text class="body"><tspan x="92" y="178">smol machines is different from other VMM's like firecracker with a</tspan><tspan x="92" y="216">focus on ease of use. Here's an example: How do you start a VM with</tspan><tspan x="92" y="254">networking enabled? 1. smolvm: &quot;smolvm machine run --net -it --image</tspan><tspan x="92" y="292">alpine -- /bin/sh&quot; docs -&gt; https://github.com/smol-machines/smolvm 2.</tspan><tspan x="92" y="330">firecracker: &quot;The first step on the host for any microVM is to create</tspan><tspan x="92" y="368">a Linux tap device, which Firecracker will use for networking...&quot; 459</tspan><tspan x="92" y="406">line quick start guide -&gt;...</tspan></text>
