  <text class="body"><tspan x="92" y="178">We built 12 open-source AI automations, one for each industry. Each</tspan><tspan x="92" y="216">one operates real legacy software: green-screen terminals, F-key</tspan><tspan x="92" y="254">navigation, 80-column grids. The kind of system people still work</tspan><tspan x="92" y="292">through by hand every day. No selectors. No scripts. No answer key.</tspan><tspan x="92" y="330">The agent looks at the screen, decides, acts, and looks again. Total</tspan><tspan x="92" y="368">cost to run all twelve: $0.28. Finance. A 3270 filings terminal. Finds</tspan><tspan x="92" y="406">the largest submission and opens its detail record....</tspan></text>
