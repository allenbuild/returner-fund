  <text class="body"><tspan x="92" y="178">We just released @c15tdev v2.2.0 c15t is growing faster than ever at</tspan><tspan x="92" y="216">69.7% MoM growth. We've almost hit 5m npm downloads in total, and in</tspan><tspan x="92" y="254">the last 30 days hit 1.5m downloads alone. 2.2 adds more of the</tspan><tspan x="92" y="292">consent-aware primitives teams need in real apps, and it had the most</tspan><tspan x="92" y="330">external contributions we’ve seen so far, which we couldn't be prouder</tspan><tspan x="92" y="368">about. Thanks to everyone using c15t, opening issues and contributing</tspan><tspan x="92" y="406">fixes. We're so excited to unveil our next stage of @inth that buil...</tspan></text>
