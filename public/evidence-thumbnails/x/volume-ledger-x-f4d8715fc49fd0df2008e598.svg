  <text class="body"><tspan x="92" y="178">Everyone says: hire people better than you, then get out of the way.</tspan><tspan x="92" y="216">One of my biggest mistakes at Algolia was taking that literally. Yes,</tspan><tspan x="92" y="254">hire people better than you. But don’t confuse seniority with earned</tspan><tspan x="92" y="292">trust. Stay close at first. Inspect the work. Pressure-test the</tspan><tspan x="92" y="330">judgment. If you’re still micromanaging after 3 months, you hired the</tspan><tspan x="92" y="368">wrong person. And trust your gut. As a founder, you are the most</tspan><tspan x="92" y="406">fine-tuned model in the world on your own company. If something fee...</tspan></text>
