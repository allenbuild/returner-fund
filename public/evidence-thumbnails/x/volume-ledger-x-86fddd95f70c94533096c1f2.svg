  <text class="body"><tspan x="92" y="178">This is appreciation post for @elonmusk. He has done soo much that</tspan><tspan x="92" y="216">founding PayPal now comes as a footnote while talking about him.</tspan><tspan x="92" y="254">Electric cars, solving autonomous vehicles, rockets, starlink,</tspan><tspan x="92" y="292">Twitter, Gen AI via xAI, neuralink, humanoid robots, SolarCity,</tspan><tspan x="92" y="330">founding OpenAI, Hyperloop, Boring.... He is still only 52 and just</tspan><tspan x="92" y="368">getting started on his biggest legacy yet (Mars colonization).</tspan></text>
