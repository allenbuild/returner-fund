  <text class="body"><tspan x="92" y="178">Yesterday we dropped our latest write-up on a previous Chrome 0-day.</tspan><tspan x="92" y="216">Today we got assigned yet another Chrome 0-day: CVE-2026-7899 — along</tspan><tspan x="92" y="254">with a $55,000 bounty from Google If you haven’t read yesterday’s blog</tspan><tspan x="92" y="292">yet, go check it out down below. It’s a fun one. Now it’s time for us</tspan><tspan x="92" y="330">to prepare the next few write-ups. A Chrome RCE and a Linux kernel</tspan><tspan x="92" y="368">local privilege escalation. Stay tuned 👀</tspan><tspan x="92" y="406">https://nebusec.ai/research/v8-maglev-incorrect-phis-untagging/?v=0</tspan></text>
