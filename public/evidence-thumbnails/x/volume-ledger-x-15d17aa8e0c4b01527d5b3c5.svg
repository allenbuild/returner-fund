  <text x="146" y="94" class="author">Andrej Karpathy</text>
  <text x="146" y="128" class="handle">@karpathy</text>
  <text x="92" y="113" class="date">Sat Apr 04 16:45:23 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Wow, this tweet went very viral! I wanted share a possibly slightly</tspan><tspan x="92" y="216">improved version of the tweet in an &quot;idea file&quot;. The idea of the idea</tspan><tspan x="92" y="254">file is that in this era of LLM agents, there is less of a point/need</tspan><tspan x="92" y="292">of sharing the specific code/app, you just share the idea, then the</tspan><tspan x="92" y="330">other person's agent customizes &amp; builds it for your specific needs.</tspan><tspan x="92" y="368">So here's the idea in a gist format:</tspan><tspan x="92" y="406">https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f Y...</tspan></text>
  <text x="92" y="476" class="metrics">7.3M views / 26.9K likes / 2.8K reposts / 679 quotes</text>
