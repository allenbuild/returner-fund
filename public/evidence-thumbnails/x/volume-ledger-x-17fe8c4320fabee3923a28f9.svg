  <text class="body"><tspan x="92" y="178">I’m building a company around a problem I call the programmable face.</tspan><tspan x="92" y="216">What happens when a human face becomes an infinitely recombinable</tspan><tspan x="92" y="254">input? Two weeks ago we launched @mirrormirror_ai, starting in</tspan><tspan x="92" y="292">fashion. I wrote an essay mapping how we got here, and why this moment</tspan><tspan x="92" y="330">calls for new infrastructure, not just new laws. Thank you @speedrun</tspan><tspan x="92" y="368">newsletter for featuring it.</tspan></text>
