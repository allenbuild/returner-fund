  <text class="body"><tspan x="92" y="178">It seems like there are two main objections to this, both of which I’m</tspan><tspan x="92" y="216">sympathetic to: 1. The original work itself should be made available</tspan><tspan x="92" y="254">in digital format. Agreed, but this is illegal. Perhaps you think it</tspan><tspan x="92" y="292">shouldn’t be, but it violates the rights of the publisher under</tspan><tspan x="92" y="330">current IP law. 2. The physical form was somehow the artistic creation</tspan><tspan x="92" y="368">itself (ie it’s an original manuscript or a single original version)</tspan><tspan x="92" y="406">and is not reproducible by its nature. By this I mean that they...</tspan></text>
