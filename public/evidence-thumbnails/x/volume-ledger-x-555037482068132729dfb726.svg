  <text class="body"><tspan x="92" y="178">How many puppies does it take for a full coat? Is she lining it?</tspan><tspan x="92" y="216">Collar &amp; cuffs? Who’s doing the actual work? Jasper and Horace don’t</tspan><tspan x="92" y="254">seem like the kind of guys who know how to properly skin and tan fur.</tspan><tspan x="92" y="292">If Cruella planned to outsource, where are the furriers waiting for</tspan><tspan x="92" y="330">delivery? Where’s the equipment? Turning dog skins into wearable fur</tspan><tspan x="92" y="368">coats is a complicated process requiring specialized tools, chemicals,</tspan><tspan x="92" y="406">and expertise. There’s no sign she has any of that. What’s the...</tspan></text>
