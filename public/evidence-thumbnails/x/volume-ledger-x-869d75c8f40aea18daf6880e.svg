  <text x="92" y="113" class="date">Tue Jan 23 00:51:41 +0000 2024</text>
  <text class="body"><tspan x="92" y="178">Being a TA of a security class for senior undergrad. A student came</tspan><tspan x="92" y="216">for help with an OOB bug. I asked “what’s the difference between</tspan><tspan x="92" y="254">0x40000 and 0x400c0”, he thought about it and said “0”. I was so</tspan><tspan x="92" y="292">confused but he explained “0 x 40000 = 0, 0 x 400c0 = 0, 0-0=0”. I was</tspan><tspan x="92" y="330">convinced.</tspan></text>
