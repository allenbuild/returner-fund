  <text class="body"><tspan x="92" y="178">A few random notes from claude coding quite a bit last few weeks.</tspan><tspan x="92" y="216">Coding workflow. Given the latest lift in LLM coding capability, like</tspan><tspan x="92" y="254">many others I rapidly went from about 80% manual+autocomplete coding</tspan><tspan x="92" y="292">and 20% agents in November to 80% agent coding and 20% edits+touchups</tspan><tspan x="92" y="330">in December. i.e. I really am mostly programming in English now, a bit</tspan><tspan x="92" y="368">sheepishly telling the LLM what code to write... in words. It hurts</tspan><tspan x="92" y="406">the ego a bit but the power to operate over software in large &quot;code...</tspan></text>
