  <text x="146" y="94" class="author">Min</text>
  <text x="146" y="128" class="handle">@themichelinmin</text>
  <text x="92" y="113" class="date">Tue Apr 21 17:50:29 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">The moment NIL passed, every sports team in America became a business.</tspan><tspan x="92" y="216">Most of them just don't know it yet. Ticket sales. Media rights.</tspan><tspan x="92" y="254">Sponsorships. That was enough when talent cost was fixed. NIL broke</tspan><tspan x="92" y="292">that equation. The teams that win the next decade won't just have the</tspan><tspan x="92" y="330">best athletes. They'll have the most sellable assets and the deepest</tspan><tspan x="92" y="368">fan value. If you're not building both right now, you're not treading</tspan><tspan x="92" y="406">water. You're falling behind. #SportsBusiness #NIL #SportsStrategy</tspan></text>
