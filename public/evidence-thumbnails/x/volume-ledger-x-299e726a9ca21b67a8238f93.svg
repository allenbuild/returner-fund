  <text class="body"><tspan x="92" y="178">There's this thing with agents where you're mostly on a roll gliding</tspan><tspan x="92" y="216">through stuff, but then you hit that one task. It doesn't get fixed</tspan><tspan x="92" y="254">instantly. &quot;WHY you exclaim WHY&quot; the dopamine doesn't hit quite the</tspan><tspan x="92" y="292">same when it's not working. So you keep digging yourself into a hole.</tspan><tspan x="92" y="330">You're 15 commits deep. You're not sure exactly what they all do , but</tspan><tspan x="92" y="368">hey that was &quot;work&quot; so you keep them. You circle through models,</tspan><tspan x="92" y="406">providers, until you realize that you've been prompting into oblivi...</tspan></text>
