  <text class="body"><tspan x="92" y="178">Every agent should have a powerful &amp; persistent cloud computer.</tspan><tspan x="92" y="216">Starting a VM used to mean friction: wizards, configs, and</tspan><tspan x="92" y="254">boilerplate. We stripped all that away. Now it’s just: `machine0 new</tspan><tspan x="92" y="292">myvm`. Multi-region with sizes up to 240GB RAM, 60 vCPU &amp; GPUs. Billed</tspan><tspan x="92" y="330">by the minute. $5 min top up. Get started at http://machine0.io</tspan></text>
