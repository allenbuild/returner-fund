  <text x="92" y="113" class="date">Wed Jun 03 04:39:53 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Interesting @MarkKoyama review in @WorksInProgMag about Tyler</tspan><tspan x="92" y="216">Goodspeed’s new book Recession. “In his data… the relationship between</tspan><tspan x="92" y="254">the age of an expansion and the probability of death is essentially</tspan><tspan x="92" y="292">zero.” A useful corrective to AI bubble discourse. Big booms often</tspan><tspan x="92" y="330">attract moralizing explanations. But “a lot of people are investing a</tspan><tspan x="92" y="368">lot of money” is not the same thing as “the bust is inevitable.”</tspan><tspan x="92" y="406">Sometimes the locusts just show up....</tspan></text>
