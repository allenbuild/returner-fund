  <text x="92" y="113" class="date">Wed Jul 15 05:44:12 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Dev/prod separation is right but it's treating the symptom. The real</tspan><tspan x="92" y="216">problem is that nobody tested what the agent would do in a realistic</tspan><tspan x="92" y="254">environment before shipping it. Mocks don't have real tokens. They</tspan><tspan x="92" y="292">don't have real permissions. They don't have webhooks that fire twice.</tspan><tspan x="92" y="330">You're not testing your agent, you're testing a fake version of it</tspan><tspan x="92" y="368">with only the happy paths.</tspan></text>
  <text x="92" y="476" class="metrics">599 views / 2 likes</text>
