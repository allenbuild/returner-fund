  <text class="body"><tspan x="92" y="178">The public data on Chai-2 remains exclusively in silico for safety.</tspan><tspan x="92" y="216">They have in silico ‘humanness’ and immunogenicity scores. If they had</tspan><tspan x="92" y="254">something more, Chai-2 would've been in Nature main. Post-hoc</tspan><tspan x="92" y="292">screening filtered via a ranking model doesn't count as 'deterministic</tspan><tspan x="92" y="330">molecular engineering' yet If the problem was solved, Chai would start</tspan><tspan x="92" y="368">developing like DESRES does. Which one is it: (A) Lilly is giving them</tspan><tspan x="92" y="406">money for the talent to fine-tune models on their proprietary datas...</tspan></text>
