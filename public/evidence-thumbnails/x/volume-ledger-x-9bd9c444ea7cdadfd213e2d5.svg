  <text x="146" y="94" class="author">Erin Meryl McGurk</text>
  <text x="146" y="128" class="handle">@erinmerylstudy</text>
  <text x="92" y="113" class="date">Thu Jul 09 16:31:25 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Today every app you use is learning from your data, but you do not get</tspan><tspan x="92" y="216">control over what it stores, what it uses, or where it goes next.</tspan><tspan x="92" y="254">ChatGPT knows one slice. Claude knows another. Your inbox, calendar,</tspan><tspan x="92" y="292">docs, Slack, GitHub, Spotify, Amazon, and AI agents all hold different</tspan><tspan x="92" y="330">pieces of information about you. That information can make AI apps</tspan><tspan x="92" y="368">more useful, but it is trapped inside each individual app. So you keep</tspan><tspan x="92" y="406">re-explaining yourself.</tspan></text>
