  <text x="146" y="94" class="author">Lewis Jones</text>
  <text x="146" y="128" class="handle">@thelcjones</text>
  <text x="92" y="113" class="date">Thu Aug 13 07:31:41 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">I used to think humanoids were silly until I read an article by</tspan><tspan x="92" y="216">@RajatBhageria at @ChefRobotics that explained how restaurants really</tspan><tspan x="92" y="254">only have peak food production at lunch and dinner time, and the</tspan><tspan x="92" y="292">workers need to be doing non-serving tasks at all other hours. Having</tspan><tspan x="92" y="330">generalizable robots is critical to automate tasks like these since</tspan><tspan x="92" y="368">it’ll never make unit economics sense if it’s designed for just those</tspan><tspan x="92" y="406">peak hours. I think many many sectors and jobs are shaped like this</tspan></text>
  <text x="92" y="476" class="metrics">7.8K views / 64 likes / 4 reposts / 8 replies</text>
