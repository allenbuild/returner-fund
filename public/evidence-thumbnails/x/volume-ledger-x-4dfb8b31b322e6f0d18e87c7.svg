  <text class="body"><tspan x="92" y="178">Some features: • Triggers (crons, webhooks), memory, shared files •</tspan><tspan x="92" y="216">Connectors for a company brain • Agent browser support • Shareable web</tspan><tspan x="92" y="254">app artifacts • Multi-player projects Like many things we do at YC,</tspan><tspan x="92" y="292">it’s an experiment. It’s early and has bugs. But it’s been</tspan><tspan x="92" y="330">surprisingly useful for us so far, and we’re excited to share it and</tspan><tspan x="92" y="368">get feedback from the community. If you want to host it yourself, try</tspan><tspan x="92" y="406">telling your coding agent of choice to “deploy...</tspan></text>
