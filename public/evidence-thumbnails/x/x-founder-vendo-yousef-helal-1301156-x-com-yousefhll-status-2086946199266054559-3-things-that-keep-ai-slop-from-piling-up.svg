  <text class="body"><tspan x="92" y="178">3 things that keep AI slop from piling up. I spent this weekend</tspan><tspan x="92" y="216">deleting 10s of thousands of lines from the @runvendo codebase and</tspan><tspan x="92" y="254">refactoring even more. Most of it was scope creep and overcomplication</tspan><tspan x="92" y="292">from claude code that had continuously multiplied over the last month.</tspan><tspan x="92" y="330">Here's how I am now keeping it in check: &gt; Architecture decisions get</tspan><tspan x="92" y="368">made early, not figured out mid-build. Every single decision should be</tspan><tspan x="92" y="406">decided with you before the agent even starts coding &gt; Before writi...</tspan></text>
