  <text class="body"><tspan x="92" y="178">Every decade, there is a big company founders are told to fear.</tspan><tspan x="92" y="216">1990's: What if Microsoft bundles this in Windows? Didn't matter to</tspan><tspan x="92" y="254">Intuit. 2000's: What if Google gives it away for free? Didn't matter</tspan><tspan x="92" y="292">to Dropbox. 2010's: What if Amazon builds it? Didn't matter to</tspan><tspan x="92" y="330">Shopify. 2020's: What if Anthropic builds it? Didn't matter to Cursor.</tspan><tspan x="92" y="368">Your startup will probably not fail because you get beat by a big</tspan><tspan x="92" y="406">company. You will fail because you run out of money or mental energ...</tspan></text>
