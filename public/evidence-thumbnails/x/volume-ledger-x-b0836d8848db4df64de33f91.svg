  <text class="body"><tspan x="92" y="178">Something I think people continue to have poor intuition for: The</tspan><tspan x="92" y="216">space of intelligences is large and animal intelligence (the only kind</tspan><tspan x="92" y="254">we've ever known) is only a single point, arising from a very specific</tspan><tspan x="92" y="292">kind of optimization that is fundamentally distinct from that of our</tspan><tspan x="92" y="330">technology. Animal intelligence optimization pressure: - innate and</tspan><tspan x="92" y="368">continuous stream of consciousness of an embodied &quot;self&quot;, a drive for</tspan><tspan x="92" y="406">homeostasis and self-preservation in a dangerous, physical world. -...</tspan></text>
