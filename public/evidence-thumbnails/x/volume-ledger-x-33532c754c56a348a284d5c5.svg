  <text x="146" y="94" class="author">Christopher Burns</text>
  <text x="146" y="128" class="handle">@BurnedChris</text>
  <text x="92" y="113" class="date">Mon Jun 29 18:46:40 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Rampart from @ndstudio is very cool. I like it because it focuses on</tspan><tspan x="92" y="216">one of the simplest privacy questions in AI products: can we avoid</tspan><tspan x="92" y="254">sending sensitive text in the first place? When someone types into a</tspan><tspan x="92" y="292">chatbot, that text can pass through app servers, model providers,</tspan><tspan x="92" y="330">logs, traces, analytics, crash reports, third-party SDKs, and other</tspan><tspan x="92" y="368">vendors. Once raw text leaves the browser, the number of places you</tspan><tspan x="92" y="406">have to trust gets much bigger. Rampart redacts sensitive terms in ...</tspan></text>
