  <text x="146" y="94" class="author">Andrej Karpathy</text>
  <text x="146" y="128" class="handle">@karpathy</text>
  <text x="92" y="113" class="date">Wed Feb 25 00:21:37 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">With the coming tsunami of demand for tokens, there are significant</tspan><tspan x="92" y="216">opportunities to orchestrate the underlying memory+compute *just</tspan><tspan x="92" y="254">right* for LLMs. The fundamental and non-obvious constraint is that</tspan><tspan x="92" y="292">due to the chip fabrication process, you get two completely distinct</tspan><tspan x="92" y="330">pools of memory (of different physical implementations too): 1)</tspan><tspan x="92" y="368">on-chip SRAM that is immediately next to the compute units that is</tspan><tspan x="92" y="406">incredibly fast but of very of low capacity, and 2) off-chip DRAM...</tspan></text>
  <text x="92" y="476" class="metrics">2.6M views / 7.3K likes / 493 reposts / 55 quotes</text>
