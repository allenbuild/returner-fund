  <text class="body"><tspan x="92" y="178">❕The 14th largest U.S. homebuilder $DFH wants to gobble up the 21st</tspan><tspan x="92" y="216">largest $BZH to make themselves the 8th largest The offer is for</tspan><tspan x="92" y="254">$25.75/share (Beazer was trading at $18ish) Beazer says their book</tspan><tspan x="92" y="292">value is $41.83/share. Which might not actually be far off. Their</tspan><tspan x="92" y="330">balance sheet actually looks great. The business seems mismanaged.</tspan><tspan x="92" y="368">Book value isn’t hard cash of course, it’s land, inventory, lot</tspan><tspan x="92" y="406">deposits, debt, dreams and vibes It’s not an intangible goodwill...</tspan></text>
