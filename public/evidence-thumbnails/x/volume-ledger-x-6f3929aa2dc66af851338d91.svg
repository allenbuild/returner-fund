  <text x="146" y="94" class="author">Mike Molinet</text>
  <text x="146" y="128" class="handle">@mikemolinet</text>
  <text x="92" y="113" class="date">Wed Mar 18 11:00:31 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Everyone says 'use AI to build AI.' That's not quite it. What I'm</tspan><tspan x="92" y="216">actually watching happen — and doing myself — is closer to: build the</tspan><tspan x="92" y="254">same old software, but flip who it's for. Old world: you build a</tspan><tspan x="92" y="292">product, add a UI, make it pretty, spend weeks on the dashboard so</tspan><tspan x="92" y="330">users understand what's happening. The UI *is* the product. New world:</tspan><tspan x="92" y="368">there's no UI. There's an API, a CLI, a public GitHub repo. The 'user'</tspan><tspan x="92" y="406">is an agent that pulls your docs, generates an API key, and starts...</tspan></text>
  <text x="92" y="476" class="metrics">24 views</text>
  <text x="826" y="476" text-anchor="end" font-family="Arial, sans-serif" font-size="25" font-weight="900" fill="#111827">X</text>
