  <text x="146" y="94" class="author">Andrej Karpathy</text>
  <text x="146" y="128" class="handle">@karpathy</text>
  <text x="92" y="113" class="date">Sun Dec 07 18:13:45 +0000 2025</text>
  <text class="body"><tspan x="92" y="178">Don't think of LLMs as entities but as simulators. For example, when</tspan><tspan x="92" y="216">exploring a topic, don't ask: &quot;What do you think about xyz&quot;? There is</tspan><tspan x="92" y="254">no &quot;you&quot;. Next time try: &quot;What would be a good group of people to</tspan><tspan x="92" y="292">explore xyz? What would they say?&quot; The LLM can channel/simulate many</tspan><tspan x="92" y="330">perspectives but it hasn't &quot;thought about&quot; xyz for a while and over</tspan><tspan x="92" y="368">time and formed its own opinions in the way we're used to. If you</tspan><tspan x="92" y="406">force it via the use of &quot;you&quot;, it will give you something by adopti...</tspan></text>
