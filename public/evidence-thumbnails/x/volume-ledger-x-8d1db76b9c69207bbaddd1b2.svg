  <text class="body"><tspan x="92" y="178">STOP BUILDING SOFTWARE. I’ve talked to so many startups trying to do</tspan><tspan x="92" y="216">some kind of software tool for robotics and it’s very hard for me to</tspan><tspan x="92" y="254">believe in any of them. If you want to sell picks and shovels to</tspan><tspan x="92" y="292">robotics, build a hardware company instead. Better edge compute,</tspan><tspan x="92" y="330">better sensors, better actuators, better manufacturing equipment, even</tspan><tspan x="92" y="368">just operating better machine shops. We will happily onboard new</tspan><tspan x="92" y="406">hardware vendors and take a bet on you because that is the bottlene...</tspan></text>
