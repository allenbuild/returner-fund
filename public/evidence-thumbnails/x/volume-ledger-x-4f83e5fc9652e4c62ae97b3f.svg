  <text x="92" y="113" class="date">Fri Dec 26 17:36:02 +0000 2025</text>
  <text class="body"><tspan x="92" y="178">I've never felt this much behind as a programmer. The profession is</tspan><tspan x="92" y="216">being dramatically refactored as the bits contributed by the</tspan><tspan x="92" y="254">programmer are increasingly sparse and between. I have a sense that I</tspan><tspan x="92" y="292">could be 10X more powerful if I just properly string together what has</tspan><tspan x="92" y="330">become available over the last ~year and a failure to claim the boost</tspan><tspan x="92" y="368">feels decidedly like skill issue. There's a new programmable layer of</tspan><tspan x="92" y="406">abstraction to master (in addition to the usual layers below)...</tspan></text>
  <text x="92" y="476" class="metrics">17M views / 55.5K likes / 7.4K reposts / 2.9K quotes</text>
