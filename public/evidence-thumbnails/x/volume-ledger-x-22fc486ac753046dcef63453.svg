  <text class="body"><tspan x="92" y="178">The first 100% autonomous coast-to-coast drive on Tesla FSD V14.2! 2</tspan><tspan x="92" y="216">days 20 hours, 2732 miles, zero interventions. This one is special</tspan><tspan x="92" y="254">because the coast-to-coast drive was a major goal for the autopilot</tspan><tspan x="92" y="292">team from the start. A lot of hours were spent in marathon clip review</tspan><tspan x="92" y="330">sessions late into the night looking over interventions as we</tspan><tspan x="92" y="368">attempted legs of the drive over time - triaging, categorizing,</tspan><tspan x="92" y="406">planning out all the projects to close the gap and bring the number...</tspan></text>
