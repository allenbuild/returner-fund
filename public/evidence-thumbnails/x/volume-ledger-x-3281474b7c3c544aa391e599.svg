  <text class="body"><tspan x="92" y="178">Excited to finally share: after five years as a scientist, I've left</tspan><tspan x="92" y="216">my corporate job to build a startup full-time with my dream</tspan><tspan x="92" y="254">co-founder! From modeling to PhD in CS, to working in big tech, and</tspan><tspan x="92" y="292">now starting a startup—my career path has been unexpected but</tspan><tspan x="92" y="330">fulfilling. This decision wasn’t made lightly. Leaving stability is</tspan><tspan x="92" y="368">scary, but I'm grateful for the incredible support and advice from so</tspan><tspan x="92" y="406">many. We can't wait to share what we’re building. More updates soon 🤍</tspan></text>
