  <text class="body"><tspan x="92" y="178">It’s been a little over a week since Tax Day - be honest, did you file</tspan><tspan x="92" y="216">on time? 😉 This season, AI finally showed up in taxes for real.</tspan><tspan x="92" y="254">Perplexity, Claude, and ChatGPT all rolled out tax capabilities aimed</tspan><tspan x="92" y="292">at consumers. That’s exciting — and validating. This is the exact</tspan><tspan x="92" y="330">thesis Uday and I had when we started building Grove. But here’s the</tspan><tspan x="92" y="368">uncomfortable truth: Consumers aren't going to trust AI to file their</tspan><tspan x="92" y="406">returns anytime soon. The tolerance for error is zero. One mistake...</tspan></text>
