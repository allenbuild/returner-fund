  <text class="body"><tspan x="92" y="178">Churn has seasons. August cancels are decided in July. Subscription</tspan><tspan x="92" y="216">revenue rides on routines. The language app lives inside a morning</tspan><tspan x="92" y="254">commute. The fitness app lives inside a gym schedule. The productivity</tspan><tspan x="92" y="292">tool lives inside a work week. Summer breaks all three. - People</tspan><tspan x="92" y="330">travel - Kids are home - The commute disappears for two weeks and the</tspan><tspan x="92" y="368">streak dies with it Usage dips in July, and the renewal that comes due</tspan><tspan x="92" y="406">in August lands on a customer who has an unused app on their phone ...</tspan></text>
