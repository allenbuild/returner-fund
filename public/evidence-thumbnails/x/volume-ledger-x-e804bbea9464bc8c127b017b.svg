  <text class="body"><tspan x="92" y="178">I had a working product, ~10 paying customers, had just signed a</tspan><tspan x="92" y="216">Fortune 10 logo, and last week I still decided to pivot. 1 week later,</tspan><tspan x="92" y="254">I know it was the right call. Quick retro. On Wednesday 10 days ago, I</tspan><tspan x="92" y="292">was in a demo with a prospect who just raised a Series B. It was going</tspan><tspan x="92" y="330">well until I asked about next steps. The response were &quot;let me check</tspan><tspan x="92" y="368">with marketing if we have budget for this&quot; and &quot;we're a small team</tspan><tspan x="92" y="406">right now.&quot; But this wasn't the first time I was hearing that. The...</tspan></text>
