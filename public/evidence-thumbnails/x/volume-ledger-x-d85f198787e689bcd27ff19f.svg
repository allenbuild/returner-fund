  <text class="body"><tspan x="92" y="178">This is where I'm supposed to shill OpenWork and say that we can do it</tspan><tspan x="92" y="216">cheaper. But I don't think that's a good reason to pick OpenWork.</tspan><tspan x="92" y="254">Here's the real reason to pick us: We're building the best place for</tspan><tspan x="92" y="292">knowledge work to happen. Which also jut happens to be: a) the</tspan><tspan x="92" y="330">cheapest way to do it (because we let you pick your inference) and b)</tspan><tspan x="92" y="368">the most privacy friendly. c) &lt;- we the anti-vendor lock-in platform</tspan></text>
