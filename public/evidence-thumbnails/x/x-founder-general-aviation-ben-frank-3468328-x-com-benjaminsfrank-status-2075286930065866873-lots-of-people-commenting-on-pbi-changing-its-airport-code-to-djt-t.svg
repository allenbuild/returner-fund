  <text x="146" y="94" class="author">Ben Frank</text>
  <text x="146" y="128" class="handle">@benjaminsfrank</text>
  <text x="92" y="113" class="date">Thu Jul 09 18:32:15 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Lots of people commenting on PBI changing its airport code to DJT</tspan><tspan x="92" y="216">today. Good time to remind people of aviation data arcana: 1. The</tspan><tspan x="92" y="254">timing is not arbitrary or surprising. There are many changes to</tspan><tspan x="92" y="292">aeronautical names and codes each month and they all change at the end</tspan><tspan x="92" y="330">of the 28-day AIRAC cycle (today starts cycle 2607). 2. If your tools</tspan><tspan x="92" y="368">and airlines use ARINC 424 data properly (which they all generally</tspan><tspan x="92" y="406">do), you as the pilot or consumer do not need to do anything!</tspan></text>
  <text x="92" y="476" class="metrics">169 views / 2 likes</text>
  <text x="826" y="476" text-anchor="end" font-family="Arial, sans-serif" font-size="25" font-weight="900" fill="#111827">X</text>
