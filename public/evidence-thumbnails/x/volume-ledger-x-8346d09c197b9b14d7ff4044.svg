  <text class="body"><tspan x="92" y="178">One of the things that sucks about the shift from regular to agentic</tspan><tspan x="92" y="216">programming is the inconsistency in improving If you had a slow</tspan><tspan x="92" y="254">website before, you’d go read the docs, understand the problem, and</tspan><tspan x="92" y="292">fix it With AI, there’s a million different workflows that people</tspan><tspan x="92" y="330">tout, all with varying inconsistent levels of success There’s also a</tspan><tspan x="92" y="368">huge amount of grifting or people talking about the topic who don’t</tspan><tspan x="92" y="406">actually ship real apps with real users You can go adopt /loop or...</tspan></text>
