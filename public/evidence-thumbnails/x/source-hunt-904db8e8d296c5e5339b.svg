  <text class="body"><tspan x="92" y="178">imho most people don't really need to worry about all of these new</tspan><tspan x="92" y="216">terms. The delta between the feature availability in a top development</tspan><tspan x="92" y="254">tool (codex, claude, cursor etc.) &amp; the developer consensus on AI</tspan><tspan x="92" y="292">development practices is very little. Most people can wait 10-15 days</tspan><tspan x="92" y="330">post-developer consensus on a technique and use it natively without</tspan><tspan x="92" y="368">having to do anything on their own. (this is for people who get</tspan><tspan x="92" y="406">fatigued by hearing all these new ways to do AI coding)</tspan></text>
