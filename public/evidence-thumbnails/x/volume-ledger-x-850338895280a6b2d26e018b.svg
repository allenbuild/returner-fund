  <text class="body"><tspan x="92" y="178">I’ve been using RoughDraft almost exclusively since I got access.</tspan><tspan x="92" y="216">Undoubtedly an upgrade over TUI and linear chat for interacting with</tspan><tspan x="92" y="254">Claude Code. Musings: Linear chat as an interaction pattern is like</tspan><tspan x="92" y="292">trying to squeeze the universe through a tube of toothpaste. You’re</tspan><tspan x="92" y="330">losing so much when you reduce fable and Sol to linear chat. RLM</tspan><tspan x="92" y="368">patterns like dynamic workflows are uniquely suited to non-linear</tspan><tspan x="92" y="406">chat. Chat as a form factor kind of spilled out of the linear...</tspan></text>
