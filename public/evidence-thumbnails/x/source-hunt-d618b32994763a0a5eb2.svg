  <text x="146" y="94" class="author">Benjamin Shafii</text>
  <text x="146" y="128" class="handle">@benjaminshafii</text>
  <text x="92" y="113" class="date">Tue Jul 14 00:31:36 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">VCs are big-braining what &quot;ai multiplayer&quot; means. Multiplayer is not a</tspan><tspan x="92" y="216">new UX, it's making old UX work seamlessly with AI agents. Your</tspan><tspan x="92" y="254">coworkers are already using notion, slack, google docs, gmail - you're</tspan><tspan x="92" y="292">already doing multiplayer. The problem with agents is: a) how can you</tspan><tspan x="92" y="330">securely (and easily) give them access to the same tools. b) how to</tspan><tspan x="92" y="368">give them shared context while they use these various tools.</tspan></text>
