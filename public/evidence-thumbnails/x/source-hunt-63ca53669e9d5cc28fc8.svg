  <text x="146" y="94" class="author">Emil Falk</text>
  <text x="146" y="128" class="handle">@falkemil_</text>
  <text x="92" y="113" class="date">Mon May 04 23:10:49 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">The big defense primes are optimized for a world that's in peace.</tspan><tspan x="92" y="216">High-margin. Low-volume. Cost-plus contracts. That model printed money</tspan><tspan x="92" y="254">for 20 years, but the defense industry is shifting from contract-based</tspan><tspan x="92" y="292">to product-based procurement, and that changes everything. Why pay $5M</tspan><tspan x="92" y="330">per missile when you can get like-minded specs for under $100K? You</tspan><tspan x="92" y="368">can't cost-engineer your way out of a structural problem. These</tspan><tspan x="92" y="406">companies aren't slow because of bad management, they're slow becau...</tspan></text>
