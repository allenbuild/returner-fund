  <text class="body"><tspan x="92" y="178">robots should belong to the builders. figure is building robot labor</tspan><tspan x="92" y="216">as a service for warehouses. 1x is building robots as a service for</tspan><tspan x="92" y="254">the home. tesla is starting with humanoids inside its own factories.</tspan><tspan x="92" y="292">if only a handful of companies own the robots, they also own the data,</tspan><tspan x="92" y="330">the deployment layer, and eventually the way physical work gets</tspan><tspan x="92" y="368">automated. but the world is too messy for one closed fleet to map all</tspan><tspan x="92" y="406">of it. every factory, warehouse, hotel, lab, farm, hospital, and ho...</tspan></text>
