  <text class="body"><tspan x="92" y="178">crazy how the launch video was pure sci-fi, golden pools of light,</tspan><tspan x="92" y="216">half a million sensors and stuff. then you watch the breakdown and</tspan><tspan x="92" y="254">it's just the team, super chill, walking through how they actually</tspan><tspan x="92" y="292">built it. no spectacle, just engineers explaining a really cool</tspan><tspan x="92" y="330">machine like it's the most natural thing. love that even the most</tspan><tspan x="92" y="368">futuristic looking device come back down to simple ideas joined</tspan><tspan x="92" y="406">together. glad they shared the breakdown...</tspan></text>
