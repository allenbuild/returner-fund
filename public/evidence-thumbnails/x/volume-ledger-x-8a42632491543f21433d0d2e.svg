  <text class="body"><tspan x="92" y="178">I am unreasonably excited about self-driving. It will be the first</tspan><tspan x="92" y="216">technology in many decades to visibly terraform outdoor physical</tspan><tspan x="92" y="254">spaces and way of life. Less parked cars. Less parking lots. Much</tspan><tspan x="92" y="292">greater safety for people in and out of cars. Less noise pollution.</tspan><tspan x="92" y="330">More space reclaimed for humans. Human brain cycles and attention</tspan><tspan x="92" y="368">capital freed up from “lane following” to other pursuits. Cheaper,</tspan><tspan x="92" y="406">faster, programmable delivery of physical items and goods. It won’t...</tspan></text>
