  <text x="92" y="113" class="date">Sun Jun 16 04:58:34 +0000 2024</text>
  <text class="body"><tspan x="92" y="178">A five year old and Einstein can both agree 1+1=2 If there is an</tspan><tspan x="92" y="216">optimal solution, it doesn’t necessarily matter how intelligent you</tspan><tspan x="92" y="254">are to arrive at that solution The challenge has always been knowing</tspan><tspan x="92" y="292">what questions at ask, which has more to do with data than</tspan><tspan x="92" y="330">intelligence</tspan></text>
