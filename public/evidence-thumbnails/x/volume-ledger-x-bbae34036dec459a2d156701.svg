  <text x="92" y="113" class="date">Sun Aug 02 23:33:56 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">PS: we've obviously had agents for a while. In fact, we had too many.</tspan><tspan x="92" y="216">Teams and individuals at Vercel started building and deploying agents.</tspan><tspan x="92" y="254">Dozens of them. Using a web analogy, that'd be like every agent having</tspan><tspan x="92" y="292">its own domain name. Not a good UX. I just want ${company}⁠.com! @𝚟</tspan><tspan x="92" y="330">solved that problem for us. It's both an agent and a router. It has</tspan><tspan x="92" y="368">sub-agents, skills, and it knows how to delegate work to other agents.</tspan><tspan x="92" y="406">Another analogy is that it's a bit like a &quot;monolith&quot; or &quot;monorepo&quot;,...</tspan></text>
  <text x="92" y="476" class="metrics">17K views / 128 likes / 1 quotes / 10 replies</text>
