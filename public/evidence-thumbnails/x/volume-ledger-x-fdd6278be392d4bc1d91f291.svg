  <text class="body"><tspan x="92" y="178">“Everyone is going to make their own apps with AI&quot; Please. You don't</tspan><tspan x="92" y="216">even make your own sandwich—you @DoorDash it. You'll still pay for</tspan><tspan x="92" y="254">apps built by people who understand product. #AI is a multiplier, not</tspan><tspan x="92" y="292">magic. If your starting point is zero, multiplying by infinity still</tspan><tspan x="92" y="330">equals zero.</tspan></text>
