  <text x="146" y="94" class="author">Nalin Gupta</text>
  <text x="146" y="128" class="handle">@nalingupta01</text>
  <text x="92" y="113" class="date">Tue Feb 27 21:52:56 +0000 2024</text>
  <text class="body"><tspan x="92" y="178">One limitation of hosting communities on @SlackHQ is that you can't</tspan><tspan x="92" y="216">see 90+ day old conversations unless the admins have purchased an</tspan><tspan x="92" y="254">enterprise plan, which is very costly for hackathons/open-source</tspan><tspan x="92" y="292">communities. Slack should instead make members (not admins) pay</tspan><tspan x="92" y="330">$10/month for being able to see older conversations. This way, admins</tspan><tspan x="92" y="368">are not footing the bill and members who are really want to access</tspan><tspan x="92" y="406">older chats can easily do so without being limited by admins.</tspan></text>
  <text x="92" y="476" class="metrics">293 views / 3 likes</text>
