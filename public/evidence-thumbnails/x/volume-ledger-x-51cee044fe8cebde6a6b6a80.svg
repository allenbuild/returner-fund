  <text class="body"><tspan x="92" y="178">Every investor has asked me “why won’t Anthropic or OpenAI just build</tspan><tspan x="92" y="216">this internally?” I answer it the same way every time. First: every</tspan><tspan x="92" y="254">time you use something and it gives you a feedback loop, it gets</tspan><tspan x="92" y="292">harder and harder to replicate. We’re building that layer. Second:</tspan><tspan x="92" y="330">would you trust Claude to honestly tell you if your own product works</tspan><tspan x="92" y="368">well for agents? Probably not. We’re the neutral third party they</tspan><tspan x="92" y="406">aren’t. In marketing there’s always a neutral third party for...</tspan></text>
