  <text class="body"><tspan x="92" y="178">One common issue with personalization in all LLMs is how distracting</tspan><tspan x="92" y="216">memory seems to be for the models. A single question from 2 months ago</tspan><tspan x="92" y="254">about some topic can keep coming up as some kind of a deep interest of</tspan><tspan x="92" y="292">mine with undue mentions in perpetuity. Some kind of trying too hard.</tspan></text>
