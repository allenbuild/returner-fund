  <text x="146" y="94" class="author">Azamat K.</text>
  <text x="146" y="128" class="handle">@ChiefSnack</text>
  <text x="92" y="113" class="date">Thu May 21 19:00:10 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Every dollar of acquisition is a tax on weak retention. And the bill</tspan><tspan x="92" y="216">always comes due. Subscription companies LOVE to talk about CAC like</tspan><tspan x="92" y="254">it is a fixed cost of doing business. Spoiler: It almost never is. CAC</tspan><tspan x="92" y="292">is mostly a function of how leaky your bucket already is: ↳ Keep 95%</tspan><tspan x="92" y="330">of your customers… …and you can spend less to acquire because the ones</tspan><tspan x="92" y="368">you have are still paying you next year. ↳ Keep 60% of your customers…</tspan><tspan x="92" y="406">…and you have to spend more every quarter to stand still. It’s like...</tspan></text>
