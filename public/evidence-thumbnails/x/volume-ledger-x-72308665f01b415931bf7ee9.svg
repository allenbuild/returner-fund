  <text x="92" y="113" class="date">Fri Jul 10 17:01:02 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Working with the team over the past few months has been incredible.</tspan><tspan x="92" y="216">Hundreds of thousands of generations. Countless late nights.</tspan><tspan x="92" y="254">Constantly throwing away work that wasn't good enough. Every week the</tspan><tspan x="92" y="292">model became a little better at designing homes. We still have an</tspan><tspan x="92" y="330">enormous amount left to build, but today feels like a meaningful step</tspan><tspan x="92" y="368">toward a future where anyone can design the spaces they want to live</tspan><tspan x="92" y="406">in.</tspan></text>
