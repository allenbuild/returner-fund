  <text x="92" y="113" class="date">Fri Feb 13 21:15:05 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Not sure who needs to hear this - but you can be humble without</tspan><tspan x="92" y="216">underselling yourself. imo, humility is about being okay with being</tspan><tspan x="92" y="254">the dumbest person in the room - but a lot people mistake as the need</tspan><tspan x="92" y="292">to make yourself seem like the dumbest person in the room, even if</tspan><tspan x="92" y="330">you’re not. someone who isn’t the dumbest person in the room but still</tspan><tspan x="92" y="368">eager to learn is infinitely more ‘humble’ than someone pretending to</tspan><tspan x="92" y="406">be the dumbest in the room - so stop underselling yourself.</tspan></text>
