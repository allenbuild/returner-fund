  <text class="body"><tspan x="92" y="178">Thank you @Daisy4ai and @kirbyman01 from @a16z for mentioning</tspan><tspan x="92" y="216">@mirrormirror_ai in your new investment thesis on AI x Online</tspan><tspan x="92" y="254">Shopping. I’ve been a huge believer in how AI can transform the</tspan><tspan x="92" y="292">fashion and online shopping landscape throughout my career, and it’s</tspan><tspan x="92" y="330">so encouraging to be recognized. We may have been building quietly,</tspan><tspan x="92" y="368">but we’re moving full speed with a killer product we haven’t shared</tspan><tspan x="92" y="406">publicly yet—and an exciting partnership we can’t wait to announce....</tspan></text>
