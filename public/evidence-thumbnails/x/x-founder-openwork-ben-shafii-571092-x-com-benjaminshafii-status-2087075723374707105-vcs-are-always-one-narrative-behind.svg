  <text class="body"><tspan x="92" y="178">VCs are always one narrative behind. Still seeing some people talking</tspan><tspan x="92" y="216">about harnesses like it's Jesus' second coming. Harnesses are</tspan><tspan x="92" y="254">important, yes. But the biggest leverage a harness has is the ability</tspan><tspan x="92" y="292">to determine which standards will get adopted. (see how claude code</tspan><tspan x="92" y="330">was able to push skills, mcp etc) Harnesses unlocked this wave of AI.</tspan><tspan x="92" y="368">They made it possible to manage high amount of context efficiently.</tspan><tspan x="92" y="406">(but imo there's practically no diff between claude code, opencode,...</tspan></text>
