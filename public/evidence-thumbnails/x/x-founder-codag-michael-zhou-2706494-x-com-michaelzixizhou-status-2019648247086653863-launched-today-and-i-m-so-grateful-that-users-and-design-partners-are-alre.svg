  <text class="body"><tspan x="92" y="178">Launched today and I'm so grateful that users and design partners are</tspan><tspan x="92" y="216">already coming in with feature requests! So here's a late night</tspan><tspan x="92" y="254">changelog: - Added support to visualize GGUF and MCP server usage -</tspan><tspan x="92" y="292">High res image exports for humongous workflows - Writing an MCP to</tspan><tspan x="92" y="330">help agents understand graphical workflow context through Codag The</tspan><tspan x="92" y="368">launch has been nerve-wracking. Cheers everyone 🫡</tspan></text>
