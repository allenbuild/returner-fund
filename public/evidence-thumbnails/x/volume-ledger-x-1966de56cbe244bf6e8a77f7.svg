  <text class="body"><tspan x="92" y="178">Looking for some advice: I started a coworking community in Seoul back</tspan><tspan x="92" y="216">in January, initially with the aim to just see the few friends I had</tspan><tspan x="92" y="254">on a regular basis. It started as a group chat of 4 where every week I</tspan><tspan x="92" y="292">would text &quot;I'm going to be a X cafe this thursday at 2pm if anyone</tspan><tspan x="92" y="330">wants to join!&quot;. That was 16 weeks ago. Since then, the group has</tspan><tspan x="92" y="368">grown incredibly fast. Entirely based on word of mouth. So many</tspan><tspan x="92" y="406">wonderful things have come out of it: roadtrips, bar hangs, creativ...</tspan></text>
