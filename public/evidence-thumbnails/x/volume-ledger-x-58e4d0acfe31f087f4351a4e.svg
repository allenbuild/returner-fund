  <text x="92" y="113" class="date">Tue Jun 23 16:42:39 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Most of YC Summer 2026 batch isn't building agents. They're building</tspan><tspan x="92" y="216">the two things agents need before anyone will use them: deep software</tspan><tspan x="92" y="254">for one unglamorous industry (manufacturing QMS, radiology,</tspan><tspan x="92" y="292">permitting, PBMs), and the layer that makes agents safe to deploy</tspan><tspan x="92" y="330">(runtime enforcement, evals, verification). The agents are good enough</tspan><tspan x="92" y="368">now. They just can't be trusted in a live workflow yet, and somebody</tspan><tspan x="92" y="406">has to fix that. The bottleneck was never intelligence. It was...</tspan></text>
