  <text class="body"><tspan x="92" y="178">Respectfully disagree. The next great AI companies aren't services</tspan><tspan x="92" y="216">companies -- they're software companies that finally learned how to</tspan><tspan x="92" y="254">encode expertise. They will win on what model providers will never</tspan><tspan x="92" y="292">build: deep domain context, workflow integration, proprietary data</tspan><tspan x="92" y="330">loops, and domain-specific UX shaped around how workers actually work.</tspan><tspan x="92" y="368">Nobody wants to manage 30 different AI services. You just want stuff</tspan><tspan x="92" y="406">to work. Knowledge work needs walls. Like bumpers in bowling, peopl...</tspan></text>
