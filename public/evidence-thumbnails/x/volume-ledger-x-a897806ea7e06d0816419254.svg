  <text x="92" y="113" class="date">Sun Feb 01 19:26:20 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Finding myself going back to RSS/Atom feeds a lot more recently.</tspan><tspan x="92" y="216">There's a lot more higher quality longform and a lot less slop</tspan><tspan x="92" y="254">intended to provoke. Any product that happens to look a bit different</tspan><tspan x="92" y="292">today but that has fundamentally the same incentive structures will</tspan><tspan x="92" y="330">eventually converge to the same black hole at the center of gravity</tspan><tspan x="92" y="368">well. We should bring back RSS - it's open, pervasive, hackable.</tspan><tspan x="92" y="406">Download a client, e.g. NetNewsWire (or vibe code one) Cold start:...</tspan></text>
