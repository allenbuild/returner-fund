  <text class="body"><tspan x="92" y="178">some of you know that i've been tinkering with local AI models on my</tspan><tspan x="92" y="216">homelab setup. It's fun but here's the reality today: - nothing you</tspan><tspan x="92" y="254">can run on consumer hardware is even close to what you can buy with a</tspan><tspan x="92" y="292">monthly subscription. The gap is ~18 years when you compare frontier</tspan><tspan x="92" y="330">to frontier, but you're actually comparing frontier cloud LLMs (1</tspan><tspan x="92" y="368">trillion parameter models) to what you can run locally which might be</tspan><tspan x="92" y="406">30-100 billion. This is a hobby! - best hardware off the shelf is...</tspan></text>
