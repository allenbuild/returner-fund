  <text x="92" y="113" class="date">Sat Jul 04 07:13:06 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">On this great birthday, let’s remember the classic American pattern:</tspan><tspan x="92" y="216">we get embarrassed, then we get busy. Sputnik went up, and within a</tspan><tspan x="92" y="254">year we’d built NASA and DARPA (new institutions, created at warp</tspan><tspan x="92" y="292">speed, that gave us the moon landing and the internet). At 250, we</tspan><tspan x="92" y="330">shouldn’t need the embarrassment. Crisis got us this far, but ambition</tspan><tspan x="92" y="368">must take us from here. We have plenty of it in this country. That</tspan><tspan x="92" y="406">ambition (and the country) deserves a government on a shot clock!...</tspan></text>
