  <text class="body"><tspan x="92" y="178">What's the Pareto frontier of human cognition on the curve of speed of</tspan><tspan x="92" y="216">output / depth of understanding? AI pushes us hard along the speed</tspan><tspan x="92" y="254">axis, but we're outsourcing the critical thinking that got us here.</tspan><tspan x="92" y="292">How soon before human intelligence atrophies?</tspan></text>
