  <text class="body"><tspan x="92" y="178">Let's go! We're out of stealth with @TolmoHQ! AI is completely</tspan><tspan x="92" y="216">redefining how software gets built. And how it's being attacked.</tspan><tspan x="92" y="254">Helping define what security means for this new world was impossible</tspan><tspan x="92" y="292">to resist. We had to go back! We’re building the AI agent fleet to</tspan><tspan x="92" y="330">secure production environments. Our security agents continuously work</tspan><tspan x="92" y="368">on a live production knowledge graph that connects data from code,</tspan><tspan x="92" y="406">cloud services, containers, databases, and third-party providers....</tspan></text>
