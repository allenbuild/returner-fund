  <text x="92" y="113" class="date">Wed Jun 24 07:00:16 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">i keep coming back to one question: what’s the most efficient way to</tspan><tspan x="92" y="216">help teams become AI-native? For us, the answer has been to stay as</tspan><tspan x="92" y="254">close to people’s existing systems as possible. we try as much to not</tspan><tspan x="92" y="292">be another platform work on top of the tools they already use mcp as</tspan><tspan x="92" y="330">the frictionless interface into company tools. and now we use existing</tspan><tspan x="92" y="368">chats as the starting point for automations that inherit the</tspan><tspan x="92" y="406">permissions, connectors, and context teams already have set up.</tspan></text>
