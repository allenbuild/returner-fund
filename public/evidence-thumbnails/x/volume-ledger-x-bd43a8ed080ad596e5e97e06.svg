  <text x="92" y="113" class="date">Fri Jul 24 22:54:47 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">I do not think mathematics is over, it's certainly about to look very</tspan><tspan x="92" y="216">different. But Jacob Tsimmerman winning the Fields Medal and</tspan><tspan x="92" y="254">immediately pivoting to AI safety is clearly a sign that this is the</tspan><tspan x="92" y="292">most important problem of our time, and it will require</tspan><tspan x="92" y="330">cross-disciplinary effort from brilliant people all over. We all need</tspan><tspan x="92" y="368">to consider what our contribution to this pivotal moment is human</tspan><tspan x="92" y="406">history is going to be.</tspan></text>
