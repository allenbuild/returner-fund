  <text class="body"><tspan x="92" y="178">Resumes suck and we all deserve better. That’s why we built Pluto. In</tspan><tspan x="92" y="216">one conversation, Pluto learns your career story, represents you to AI</tspan><tspan x="92" y="254">agents, and connects you with the right people when there’s mutual</tspan><tspan x="92" y="292">interest. 18,000+ professionals and 100+ companies are already part of</tspan><tspan x="92" y="330">the network. Excited to officially launch Pluto with @ycombinator</tspan><tspan x="92" y="368">today. P.S is that @ChristinaG325 in our launch video? 👀</tspan></text>
