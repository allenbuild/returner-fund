  <text class="body"><tspan x="92" y="178">“The stock market is a no-called-strike game. You don’t have to swing</tspan><tspan x="92" y="216">at everything.” Case study: Kohl’s $KSS At first glance this thing</tspan><tspan x="92" y="254">looked stupid cheap. $1.6B market cap Almost $1B FCF last year $674M</tspan><tspan x="92" y="292">cash $2.7B inventory Capex cut to like half of D&amp;A At least $2B in</tspan><tspan x="92" y="330">real estate (they turned down an offer around that in 2022) Then I did</tspan><tspan x="92" y="368">the fun part. Owner earnings (the true money left over for owners)</tspan><tspan x="92" y="406">$1.3B CFO - $372m Capex - $34m stock compensation - $83m lease...</tspan></text>
