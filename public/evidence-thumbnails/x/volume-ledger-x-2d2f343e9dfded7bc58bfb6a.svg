  <text class="body"><tspan x="92" y="178">An anecdote from someone going through YC S26 the thing that continues</tspan><tspan x="92" y="216">to shock me is how little fanfare there is inside YC &gt; very little</tspan><tspan x="92" y="254">effort is spent making YC feel glamorous &gt; nobody cares about titles</tspan><tspan x="92" y="292">or credentials &gt; partners are remarkably humble &gt; merch is</tspan><tspan x="92" y="330">deliberately subtle &gt; buildings are nondescript from the outside, YC</tspan><tspan x="92" y="368">has this enormous mythology around it from the inside, it feels</tspan><tspan x="92" y="406">aggressively normal nobody cares that you got into YC, everyone aro...</tspan></text>
