  <text class="body"><tspan x="92" y="178">We’ve signed at least one unicorn or decacorn per week since pivoting</tspan><tspan x="92" y="216">with almost zero online presence. Here are some of the things we did</tspan><tspan x="92" y="254">to get there: -Go through your network, and your network's network.</tspan><tspan x="92" y="292">Your first ten customers are probably through this. -Talk to A LOT of</tspan><tspan x="92" y="330">people. Host events and attend them, go to cafes, just talk to people</tspan><tspan x="92" y="368">and learn as much as you can from anyone who will give you time. In</tspan><tspan x="92" y="406">SF, this will generate leads without you even trying. But it has to...</tspan></text>
