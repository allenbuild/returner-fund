  <text x="146" y="94" class="author">Azamat K.</text>
  <text x="146" y="128" class="handle">@ChiefSnack</text>
  <text x="92" y="113" class="date">Tue Jul 07 17:01:51 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Support queues are your churn pipeline. Every open ticket is a</tspan><tspan x="92" y="216">customer halfway out. Most brands file support under cost. They grade</tspan><tspan x="92" y="254">it on resolution time and a CSAT score. Then churn climbs in a quarter</tspan><tspan x="92" y="292">where support &quot;improved,&quot; and nobody connects the two. Dashboard miss</tspan><tspan x="92" y="330">a big chunk in this: A customer files a ticket at the worst possible</tspan><tspan x="92" y="368">moment. Something they paid for stopped working. The clock on their</tspan><tspan x="92" y="406">loyalty starts the second they hit send. ↳ Hour one, they want help...</tspan></text>
