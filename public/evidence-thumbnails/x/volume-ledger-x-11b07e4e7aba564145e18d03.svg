  <text class="body"><tspan x="92" y="178">there's basically no difference in the effectiveness of MCP and CLIs +</tspan><tspan x="92" y="216">skills for agents, agents are equally effective at both CLIs are fine,</tspan><tspan x="92" y="254">but require basically a full sandbox to run making them a non starter</tspan><tspan x="92" y="292">for lightweight agents they're also lossy - you can't know without</tspan><tspan x="92" y="330">running a CLI what operations it contains, what the dangerous</tspan><tspan x="92" y="368">operations are, etc you also need skills with a CLI because you have</tspan><tspan x="92" y="406">to teach the agent how to use it, whereas with mcp you can do tool...</tspan></text>
