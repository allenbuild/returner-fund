  <text class="body"><tspan x="92" y="178">coincidentally, tasks like these are also DSPy's best use case 1. well</tspan><tspan x="92" y="216">scoped, discrete, and fairly easy to define success 2. metric for</tspan><tspan x="92" y="254">optimization is simply exact match between the model's transformation</tspan><tspan x="92" y="292">&amp; what a human would've decided (agreement) 3. prompt optimization is</tspan><tspan x="92" y="330">much more ergonomic than fine-tuning and/or RL in these cases where</tspan><tspan x="92" y="368">data might drift or SOP's change. basically, the only bottleneck is</tspan><tspan x="92" y="406">curating a golden set for GEPA 👀...</tspan></text>
