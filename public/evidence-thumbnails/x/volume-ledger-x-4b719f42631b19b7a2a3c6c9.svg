  <text x="146" y="94" class="author">Nicolas Dessaigne</text>
  <text x="146" y="128" class="handle">@dessaigne</text>
  <text x="92" y="113" class="date">Wed Jun 24 16:54:19 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">I sat with a founder this week running a Series A company of 45</tspan><tspan x="92" y="216">people, almost all engineers. A year ago that was right: by Series A</tspan><tspan x="92" y="254">or B you wanted your engineering team to be your strongest asset. Not</tspan><tspan x="92" y="292">so anymore. The teams pulling ahead keep eng small and scale through</tspan><tspan x="92" y="330">agents. The signal isn't a big team that ships anymore. It's a small</tspan><tspan x="92" y="368">team that's learned to make the machine ship for them.</tspan></text>
