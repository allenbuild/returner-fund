  <text class="body"><tspan x="92" y="178">A 16 year old in my YC batch is building infrastructure that billion</tspan><tspan x="92" y="216">dollar companies will run on. 99% of the world has no idea this is</tspan><tspan x="92" y="254">happening. This is what starting up in 2026 actually looks like. The</tspan><tspan x="92" y="292">frontier isn't in a research lab or a boardroom. It's a teenager who</tspan><tspan x="92" y="330">never learned what's supposed to be impossible, shipping the kind of</tspan><tspan x="92" y="368">systems that took funded teams years to attempt. We're going to look</tspan><tspan x="92" y="406">back and realize the future was being built by people who couldn't...</tspan></text>
