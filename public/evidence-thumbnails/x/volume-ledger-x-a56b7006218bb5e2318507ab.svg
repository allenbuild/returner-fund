  <text class="body"><tspan x="92" y="178">Thinking about software factories this morning. A lot of the things</tspan><tspan x="92" y="216">that might be considered part of the &quot;factory&quot; could also be</tspan><tspan x="92" y="254">considered part of the &quot;platform&quot;. Examples: - CI/CD system - Cloud</tspan><tspan x="92" y="292">infra - Developer tooling Even &quot;loops&quot; seem to fall under platform.</tspan><tspan x="92" y="330">Isn't design -&gt; build -&gt; test -&gt; deploy -&gt; iterate the ultimate loop?</tspan><tspan x="92" y="368">This is what we call the &quot;software development lifecycle&quot; and enabling</tspan><tspan x="92" y="406">it has been the core responsibility of platform engineers for many...</tspan></text>
