  <text x="92" y="113" class="date">Mon Jul 13 23:26:00 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">I was in YC W10 when @paulg was my group partner (because there were</tspan><tspan x="92" y="216">only 4 @ycombinator partners). Half the dinner table had CS degrees</tspan><tspan x="92" y="254">from MIT or Stanford. We argued about database indexing like it was</tspan><tspan x="92" y="292">politics. If you couldn't whiteboard a B-tree you had no business</tspan><tspan x="92" y="330">applying. This week in S26 I watched a company vibe code an entire</tspan><tspan x="92" y="368">technical app with Claude in a week. They landed a $100k contract from</tspan><tspan x="92" y="406">a Fortune 50 company. The technical bar that gatekept YC for a deca...</tspan></text>
