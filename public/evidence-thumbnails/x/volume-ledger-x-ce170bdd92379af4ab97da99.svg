  <text class="body"><tspan x="92" y="178">we will probably stop using @framer. Cannot justify the cost anymore</tspan><tspan x="92" y="216">when - doing landing pages has become soo easy using coding tools -</tspan><tspan x="92" y="254">coding tools also lets anyone in the product team edit the pages</tspan><tspan x="92" y="292">really fast without having to learn framer - we often create a single</tspan><tspan x="92" y="330">page using framer because that is super quick but framer's pricing</tspan><tspan x="92" y="368">isn't suitable for that.</tspan></text>
