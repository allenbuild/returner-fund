  <text x="146" y="94" class="author">Dan Kondratyuk</text>
  <text x="146" y="128" class="handle">@hyperparticle</text>
  <text x="92" y="113" class="date">Tue May 19 19:40:32 +0000 2026</text>
  <text class="body"><tspan x="92" y="178">Coding agents are great at writing new code, but pretty bad at</tspan><tspan x="92" y="216">deleting code. It's what inevitably leads to a lot of bloat over time.</tspan><tspan x="92" y="254">Deleting code is the halmark of a great senior engineer, i.e., one</tspan><tspan x="92" y="292">that can write the least amount of code to get the job done. In my</tspan><tspan x="92" y="330">mind that's what's missing to make them robust at building good</tspan><tspan x="92" y="368">software.</tspan></text>
  <text x="92" y="476" class="metrics">157 views / 3 likes / 1 reposts / 1 quotes</text>
