  <text class="body"><tspan x="92" y="178">at @ZommaLabs we run a lot of computer use research and evals, trying</tspan><tspan x="92" y="216">to bring it to where it's most needed: finance back office (not biased</tspan><tspan x="92" y="254">at all 🙃) we recently crossed this benchmark where our agents can now</tspan><tspan x="92" y="292">complete long running tasks cheaper than offshore, let alone onshore,</tspan><tspan x="92" y="330">back office labor. funnily enough, our agents aren't always faster</tspan><tspan x="92" y="368">than humans. but they run 24/7, scale dynamically and review in loops</tspan><tspan x="92" y="406">in ways that human teams cannot. thanks for this timely coverage...</tspan></text>
