name: Daily Score Benchmarks

on:
  schedule:
    # GitHub schedules use UTC. Running at both 05:00 and 06:00 UTC keeps this
    # aligned with 12am America/Chicago across daylight saving time changes; the
    # script exits unless the local Central time hour is midnight.
    - cron: "0 5,6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-score-benchmarks
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Update daily benchmark snapshots
        run: |
          extra_args=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            extra_args="--only-central-midnight"
          fi
          npm run benchmarks:daily -- $extra_args

      - name: Commit updated benchmark snapshots
        run: |
          if [ -z "$(git status --porcelain -- outputs/benchmarks public/graph)" ]; then
            echo "No benchmark snapshot changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/benchmarks public/graph
          git commit -m "Update daily score benchmark snapshots"
          git push
