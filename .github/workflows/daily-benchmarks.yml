name: Daily Score Benchmarks
run-name: Daily score benchmark candidate ${{ github.event.schedule || 'manual' }}

on:
  schedule:
    # Chicago alternates between UTC-6 and UTC-5. The resolver admits only the
    # candidate that is actually Central midnight on that calendar day.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve Central midnight candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.schedule.outputs.should_run }}
      scheduled_utc_hour: ${{ steps.schedule.outputs.scheduled_utc_hour }}
      trigger: ${{ steps.schedule.outputs.trigger }}
      reason: ${{ steps.schedule.outputs.reason }}
      scheduled_at: ${{ steps.schedule.outputs.scheduled_at }}
      central_date: ${{ steps.schedule.outputs.central_date }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve daily benchmark schedule
        id: schedule
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/lib/daily-benchmark-schedule.mjs

      - name: Record candidate decision
        env:
          SHOULD_RUN: ${{ steps.schedule.outputs.should_run }}
          REASON: ${{ steps.schedule.outputs.reason }}
          SCHEDULED_AT: ${{ steps.schedule.outputs.scheduled_at }}
          CENTRAL_DATE: ${{ steps.schedule.outputs.central_date }}
        run: |
          if [ "$SHOULD_RUN" = "true" ]; then
            STATUS="accepted_candidate"
          else
            STATUS="inactive_candidate"
          fi
          {
            echo "## Daily benchmark candidate"
            echo "- Status: $STATUS"
            echo "- Reason: $REASON"
            echo "- Scheduled at: ${SCHEDULED_AT:-manual}"
            echo "- Central date: ${CENTRAL_DATE:-manual}"
          } >> "$GITHUB_STEP_SUMMARY"

  update:
    name: Publish Central benchmark ${{ needs.resolve.outputs.central_date || 'manual' }}
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    concurrency:
      group: repository-publication-main
      cancel-in-progress: false
      queue: max
    outputs:
      publication_status: ${{ steps.publish.outputs.publication_status }}
      published_commit: ${{ steps.publish.outputs.published_commit }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize publication base
        run: |
          git fetch --prune origin main
          git rebase origin/main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci

      - name: Test daily benchmark updater
        timeout-minutes: 10
        run: npm run test:benchmarks:daily

      - name: Record graph generation window
        run: echo "BENCHMARK_WINDOW_START=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - name: Build app
        timeout-minutes: 15
        run: npm run build

      - name: Update daily benchmark snapshots
        timeout-minutes: 50
        env:
          SCHEDULED_UTC_HOUR: ${{ needs.resolve.outputs.scheduled_utc_hour }}
        run: |
          scheduled_args=()
          if [ -n "$SCHEDULED_UTC_HOUR" ]; then
            scheduled_args+=("--scheduled-utc-hour=$SCHEDULED_UTC_HOUR")
          fi
          npm run benchmarks:daily -- "${scheduled_args[@]}"

      - name: Resolve timeline publication mode
        id: timeline_database
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if node --input-type=module <<'NODE'
          import { validateSupabaseConfiguration } from "./scripts/lib/supabase-configuration.mjs";
          const result = validateSupabaseConfiguration(
            process.env.NEXT_PUBLIC_SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY,
            { githubActions: true }
          );
          if (!result.valid) {
            console.error(`Timeline database configuration unavailable: ${result.blockers.join(", ")}`);
            process.exit(1);
          }
          NODE
          then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Timeline database configured::The strict database-backed timeline publication gate will run."
            {
              echo "## Company Timeline publication"
              echo "- Mode: database-backed"
              echo "- Safety gate: validated privileged endpoint and service-role key"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Timeline file-backed fallback::Supabase publication credentials are unavailable or invalid. Rebuilding the complete public timeline from canonical repository evidence without a database write."
            {
              echo "## Company Timeline publication"
              echo "- Mode: file-backed fallback"
              echo "- Safety action: rebuild public timelines from canonical evidence and preserve all validated events"
              echo "- Database writes: disabled"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rebuild timeline artifacts
        timeout-minutes: 10
        env:
          TIMELINE_DATABASE_CONFIGURED: ${{ steps.timeline_database.outputs.configured }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          if [ "$TIMELINE_DATABASE_CONFIGURED" = "true" ]; then
            TIMELINE_REQUIRE_DATABASE=true npm run timeline:backfill
          else
            env -u NEXT_PUBLIC_SUPABASE_URL -u SUPABASE_SERVICE_ROLE_KEY TIMELINE_REQUIRE_DATABASE=false npm run timeline:backfill
          fi

      - name: Rebuild graph-derived artifacts
        timeout-minutes: 10
        run: npm run artifacts:derived:build

      - name: Refresh artifact manifest
        run: |
          INGESTION_RUN_ID="$(node -p "require('./public/graph/manifest.json').ingestionRunId")"
          node scripts/write-artifact-manifest.mjs --ingestion-run-id="$INGESTION_RUN_ID"

      - name: Validate generated public artifacts
        timeout-minutes: 10
        run: |
          npm run artifacts:validate
          npm run artifacts:manifest:validate
          npm run timeline:validate
          npm run artifacts:derived:validate

      - name: Commit and publish benchmark snapshots
        id: publish
        timeout-minutes: 110
        env:
          PUBLICATION_BRANCH: main
          SCHEDULED_UTC_HOUR: ${{ needs.resolve.outputs.scheduled_utc_hour }}
          TIMELINE_DATABASE_CONFIGURED: ${{ steps.timeline_database.outputs.configured }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          benchmark_files=(
            outputs/benchmarks/s2026-score-benchmarks.json
            outputs/benchmarks/s26-score-benchmarks.json
            outputs/benchmarks/a16zsr006-score-benchmarks.json
            public/graph/s2026.json
            public/graph/s2026-yc-partners.json
            public/graph/s2026-insiders.json
            public/graph/s26.json
            public/graph/s26-yc-partners.json
            public/graph/s26-insiders.json
            public/graph/a16zsr006.json
            public/graph/a16zsr006-yc-partners.json
            public/graph/a16zsr006-insiders.json
            public/graph/manifest.json
            public/timelines
            public/topic-facets
            src/lib/graph/ranked-posts-sidecar.generated.json
            artifacts/company-timeline/coverage.json
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${benchmark_files[@]}"
          if git diff --cached --quiet; then
            echo "No benchmark snapshot changes to commit."
            git fetch --prune origin "$PUBLICATION_BRANCH"
            echo "publication_status=no_changes" >> "$GITHUB_OUTPUT"
            echo "published_commit=$(git rev-parse "origin/$PUBLICATION_BRANCH")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update daily score benchmark snapshots"
          if ! git push origin "HEAD:$PUBLICATION_BRANCH"; then
            echo "::warning title=Benchmark push retry::The publication branch advanced; rebuilding once from the new main."
            git fetch --prune origin "$PUBLICATION_BRANCH"
            if ! git rebase "origin/$PUBLICATION_BRANCH"; then
              git rebase --abort || true
              echo "::error title=Benchmark rebase failed::Manual conflict resolution is required."
              exit 1
            fi

            timeout 10m npm ci
            export BENCHMARK_WINDOW_START="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            timeout 15m npm run build
            scheduled_args=()
            if [ -n "$SCHEDULED_UTC_HOUR" ]; then
              scheduled_args+=("--scheduled-utc-hour=$SCHEDULED_UTC_HOUR")
            fi
            timeout 50m npm run benchmarks:daily -- "${scheduled_args[@]}"
            if [ "$TIMELINE_DATABASE_CONFIGURED" = "true" ]; then
              timeout 4m env TIMELINE_REQUIRE_DATABASE=true npm run timeline:backfill
            else
              timeout 4m env -u NEXT_PUBLIC_SUPABASE_URL -u SUPABASE_SERVICE_ROLE_KEY TIMELINE_REQUIRE_DATABASE=false npm run timeline:backfill
            fi
            timeout 10m npm run artifacts:derived:build
            INGESTION_RUN_ID="$(node -p "require('./public/graph/manifest.json').ingestionRunId")"
            node scripts/write-artifact-manifest.mjs --ingestion-run-id="$INGESTION_RUN_ID"
            npm run artifacts:validate
            npm run artifacts:manifest:validate
            npm run timeline:validate
            timeout 10m npm run artifacts:derived:validate
            git add -- "${benchmark_files[@]}"
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            git push origin "HEAD:$PUBLICATION_BRANCH"
          fi

          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          git fetch --prune origin "$PUBLICATION_BRANCH"
          REMOTE_COMMIT="$(git rev-parse "origin/$PUBLICATION_BRANCH")"
          if ! git merge-base --is-ancestor "$PUBLISHED_COMMIT" "$REMOTE_COMMIT"; then
            echo "::error title=Benchmark publication verification failed::Published commit $PUBLISHED_COMMIT is not reachable from remote ${REMOTE_COMMIT:-missing}."
            exit 1
          fi
          echo "publication_status=published" >> "$GITHUB_OUTPUT"
          echo "published_commit=$PUBLISHED_COMMIT" >> "$GITHUB_OUTPUT"

  receipt:
    name: Audit benchmark outcome
    needs: [resolve, update]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record auditable benchmark outcome
        env:
          SHOULD_RUN: ${{ needs.resolve.outputs.should_run }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          UPDATE_RESULT: ${{ needs.update.result }}
          PUBLICATION_STATUS: ${{ needs.update.outputs.publication_status }}
          PUBLISHED_COMMIT: ${{ needs.update.outputs.published_commit }}
          CENTRAL_DATE: ${{ needs.resolve.outputs.central_date }}
        run: |
          RECEIPT_RECOGNIZED=false
          case "$PUBLICATION_STATUS" in
            published|no_changes)
              RECEIPT_RECOGNIZED=true
              ;;
          esac
          COMMIT_PROOF_VALID=false
          if [[ "$PUBLISHED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            COMMIT_PROOF_VALID=true
          fi

          if [ "$RESOLVE_RESULT" != "success" ]; then
            STATUS="resolver_failed"
          elif [ "$SHOULD_RUN" != "true" ]; then
            STATUS="inactive_candidate_no_update"
          elif [ "$UPDATE_RESULT" = "success" ] && [ "$RECEIPT_RECOGNIZED" = "true" ] && [ "$COMMIT_PROOF_VALID" = "true" ]; then
            STATUS="$PUBLICATION_STATUS"
          else
            STATUS="accepted_candidate_failed"
          fi
          {
            echo "## Daily benchmark audited outcome"
            echo "- Status: $STATUS"
            echo "- Central date: ${CENTRAL_DATE:-manual}"
            echo "- Resolver result: $RESOLVE_RESULT"
            echo "- Update result: $UPDATE_RESULT"
            echo "- Receipt recognized: $RECEIPT_RECOGNIZED"
            echo "- Commit proof valid: $COMMIT_PROOF_VALID"
            echo "- Published commit: ${PUBLISHED_COMMIT:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" = "resolver_failed" ] || [ "$STATUS" = "accepted_candidate_failed" ]; then
            echo "::error title=Daily benchmark failed::$STATUS for ${CENTRAL_DATE:-manual dispatch}"
            echo "The accepted candidate requires a successful publication job, a recognized receipt, and an exact repository-backed commit."
            exit 1
          fi
          echo "::notice title=Daily benchmark outcome::$STATUS for ${CENTRAL_DATE:-manual dispatch}"
