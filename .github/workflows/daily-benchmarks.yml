name: Daily Score Benchmarks

on:
  schedule:
    # Separate expressions let the script identify which UTC slot fired. It
    # evaluates that slot against Central midnight even when Actions starts late.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Autonomous ingestion updates the same graph and benchmark artifacts.
  group: repository-publication-main
  cancel-in-progress: false
  queue: max

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize publication base
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci

      - name: Test daily benchmark updater
        run: npm run test:benchmarks:daily

      - name: Build app
        timeout-minutes: 15
        run: npm run build

      - name: Update daily benchmark snapshots
        timeout-minutes: 10
        run: |
          scheduled_args=()
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 5 * * *") scheduled_args+=("--scheduled-utc-hour=5") ;;
              "0 6 * * *") scheduled_args+=("--scheduled-utc-hour=6") ;;
              *) echo "Unexpected benchmark schedule: ${{ github.event.schedule }}"; exit 1 ;;
            esac
          fi
          npm run benchmarks:daily -- "${scheduled_args[@]}"

      - name: Validate generated public artifacts
        run: npm run artifacts:validate

      - name: Commit updated benchmark snapshots
        run: |
          benchmark_files=(
            outputs/benchmarks/s2026-score-benchmarks.json
            outputs/benchmarks/s26-score-benchmarks.json
            outputs/benchmarks/a16zsr006-score-benchmarks.json
            public/graph/s2026.json
            public/graph/s2026-yc-partners.json
            public/graph/s2026-insiders.json
            public/graph/s26.json
            public/graph/s26-yc-partners.json
            public/graph/s26-insiders.json
            public/graph/a16zsr006.json
            public/graph/a16zsr006-yc-partners.json
            public/graph/a16zsr006-insiders.json
          )

          if [ -z "$(git status --porcelain -- "${benchmark_files[@]}")" ]; then
            echo "No benchmark snapshot changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${benchmark_files[@]}"
          git commit -m "Update daily score benchmark snapshots"
          git push
