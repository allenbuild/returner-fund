name: Technology Dashboard Refresh
run-name: Technology dashboard refresh ${{ github.event.schedule || 'manual' }}

on:
  schedule:
    # A separate hourly job keeps the existing twice-daily authenticated social
    # workflow and all of its serialization/cooldown safeguards unchanged.
    - cron: "17 * * * *"
  # The established ingestion workflow remains the source of truth for its
  # authenticated lanes. Refresh immediately after it finishes as well as on
  # the hourly public-discovery cadence.
  workflow_run:
    workflows: ["Autonomous Ingestion"]
    types: [completed]
  workflow_dispatch:
    inputs:
      skip_external_discovery:
        description: Skip public HN/GitHub/RSS discovery for this replay
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prioritize_ingestion:
    name: Keep stale ingestion ahead of dashboard work
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.priority.outputs.should_run }}
      reason: ${{ steps.priority.outputs.reason }}
      ingestion_slot_key: ${{ steps.priority.outputs.ingestion_slot_key }}
      publication_watermark: ${{ steps.priority.outputs.publication_watermark }}
      watermark_status: ${{ steps.priority.outputs.watermark_status }}
    steps:
      - name: Check out current main for priority decision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve dashboard admission from the ingestion watermark
        id: priority
        run: node scripts/lib/dashboard-refresh-priority.mjs

      - name: Record dashboard admission
        env:
          SHOULD_RUN: ${{ steps.priority.outputs.should_run }}
          REASON: ${{ steps.priority.outputs.reason }}
          INGESTION_SLOT_KEY: ${{ steps.priority.outputs.ingestion_slot_key }}
          PUBLICATION_WATERMARK: ${{ steps.priority.outputs.publication_watermark }}
          WATERMARK_STATUS: ${{ steps.priority.outputs.watermark_status }}
        run: |
          {
            echo "## Dashboard admission"
            echo "- Run: $SHOULD_RUN"
            echo "- Reason: $REASON"
            echo "- Newest ingestion slot: ${INGESTION_SLOT_KEY:-unknown}"
            echo "- Publication watermark: ${PUBLICATION_WATERMARK:-unavailable}"
            echo "- Watermark status: ${WATERMARK_STATUS:-unknown}"
            echo "- A deferred dashboard run never enters the self-hosted runner or shared publication queue."
          } >> "$GITHUB_STEP_SUMMARY"

  refresh:
    name: Build and publish the precomputed snapshot
    needs: prioritize_ingestion
    if: needs.prioritize_ingestion.outputs.should_run == 'true'
    # A publication commit can land before downstream validation reports a
    # failure. The hosted admission job reads current main rather than trusting
    # the workflow conclusion, so that valid publication can still wake this
    # job while a genuinely stale ingestion never enters the Mac queue.
    # GitHub-hosted egress can return YouTube browse queues while withholding
    # the exact player/watch metadata needed to attest publication time and
    # native views. The established Mac runner's public network returns that
    # official proof; discovery still fails closed if the proof is unavailable.
    runs-on: [self-hosted, macOS, ARM64, returner-social, returner-auth-browser]
    timeout-minutes: 18
    concurrency:
      # The job reads current main inside the serialized writer lane, so a
      # failed/cancelled ingestion wake is harmless while a publication that
      # landed before a red validation result is still picked up immediately.
      group: repository-publication-main
      queue: max
      cancel-in-progress: false
    steps:
      - name: Preflight dashboard host
        id: host_preflight
        timeout-minutes: 1
        env:
          DASHBOARD_MIN_BATTERY_PERCENT: "25"
        run: |
          set -euo pipefail
          {
            echo "ready=false"
            echo "reason=power_status_unavailable"
          } >> "$GITHUB_OUTPUT"
          POWER_STATUS="$(/usr/bin/pmset -g batt)"
          BATTERY_PERCENT="$(sed -nE 's/.*[[:space:]]([0-9]{1,3})%;.*/\1/p' <<< "$POWER_STATUS" | head -n 1)"
          if [[ "${POWER_STATUS%%$'\n'*}" != *"'AC Power'"* ]]; then
            if [[ ! "$BATTERY_PERCENT" =~ ^[0-9]+$ ]]; then
              echo "::warning title=Dashboard refresh safely deferred::The battery reserve could not be verified; the committed watermark remains stale and will retry automatically."
              exit 0
            fi
            if [ "$BATTERY_PERCENT" -lt "$DASHBOARD_MIN_BATTERY_PERCENT" ]; then
              echo "reason=battery_below_start_reserve" >> "$GITHUB_OUTPUT"
              echo "::warning title=Dashboard refresh safely deferred::Battery is ${BATTERY_PERCENT}%; the stale dashboard will retry at ${DASHBOARD_MIN_BATTERY_PERCENT}% or on AC."
              exit 0
            fi
            echo "::warning title=Dashboard using healthy battery reserve::Battery is ${BATTERY_PERCENT}%; the short refresh will run under job-scoped sleep assertions."
          fi
          POWER_ASSERTIONS="$(/usr/bin/pmset -g assertions 2>/dev/null || true)"
          if ! grep -Eq '^[[:space:]]*PreventSystemSleep[[:space:]]+1([[:space:]]|$)' <<< "$POWER_ASSERTIONS"; then
            echo "::warning title=Durable sleep assertion is missing::Job-scoped assertions will protect this refresh; reinstall the host supervisor to restore maintenance-wake coverage."
          fi
          {
            echo "ready=true"
            echo "reason=ready"
          } >> "$GITHUB_OUTPUT"

      - name: Check out current main
        if: steps.host_preflight.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Serialized jobs can begin after another artifact job has landed.
          # Always build from the current publication branch rather than an
          # old schedule/workflow-run SHA that could rebase-conflict later.
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        if: steps.host_preflight.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        if: steps.host_preflight.outputs.ready == 'true'
        run: exec /usr/bin/caffeinate -im npm ci

      - name: Validate dashboard code and deterministic build
        if: steps.host_preflight.outputs.ready == 'true'
        # This is deliberately offline: it verifies the rolling-window,
        # clustering, snapshot, and public-access contracts without making an
        # external source outage a prerequisite for publication.
        run: |
          /usr/bin/caffeinate -im npm run typecheck
          /usr/bin/caffeinate -im npx vitest run \
            tests/dashboard-pipeline.test.ts \
            tests/dashboard-external-discovery.test.ts \
            tests/dashboard-refresh.test.ts \
            tests/dashboard-returner-candidates.test.ts \
            tests/dashboard-persistence.test.ts \
            tests/dashboard-store.test.ts \
            tests/api/dashboard-route.test.ts \
            tests/dashboard-thumbnail-policy.test.ts \
            tests/dashboard-thumbnail-rendering.test.tsx \
            tests/top-stories-dashboard.test.tsx \
            tests/site-access.test.ts
          /usr/bin/caffeinate -im npm run dashboard:validate

      - name: Refresh published dashboard data
        if: steps.host_preflight.outputs.ready == 'true'
        env:
          # Optional API access only raises the public GitHub API quota. The
          # discovery implementation never writes, acts as a user, or sends
          # cookies/session data to a third party.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional official X recent-search supplements the bounded public
          # YouTube lane. The worker never receives an account session.
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          # The same service-role credentials used by the established
          # ingestion workflow make the dashboard's durable provenance and
          # rank-history projection available. The artifact is still the
          # safe fallback during a staged database rollout.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.skip_external_discovery }}" = "true" ]; then
            /usr/bin/caffeinate -im npm run dashboard:refresh -- --no-external
          else
            /usr/bin/caffeinate -im npm run dashboard:refresh
          fi

      - name: Commit a materially changed snapshot
        if: steps.host_preflight.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # `git diff` does not report a first, untracked artifact. Porcelain
          # status covers both that initial publication and later updates.
          if [ -z "$(git status --porcelain -- artifacts/dashboard/current.json public/dashboard/feed.json)" ]; then
            echo "Dashboard materialization is unchanged."
            exit 0
          fi
          git config user.name "returner-dashboard-bot"
          git config user.email "returner-dashboard-bot@users.noreply.github.com"
          git add artifacts/dashboard/current.json public/dashboard/feed.json
          git commit -m "chore: refresh technology dashboard"
          # The workflow starts from current main, but another artifact job
          # can still land during discovery. This commit changes only the two
          # regenerated Dashboard artifacts, so prefer this current worker's
          # deterministic projection if that same pair conflicts on rebase.
          for attempt in 1 2 3; do
            /usr/bin/caffeinate -im git fetch origin main
            /usr/bin/caffeinate -im git rebase -X theirs origin/main
            if /usr/bin/caffeinate -im git push origin "HEAD:main"; then
              exit 0
            fi
          done
          echo "::error title=Dashboard publication failed::Could not push the validated dashboard artifact after three bounded rebases."
          exit 1
